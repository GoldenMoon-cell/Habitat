<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>生境 · 记忆星图（样张）</title>
<style>
  :root {
    --biolum: #35f0ce;
    --cold: #cfefff;
    --warm: #ffb46b;
    --mist: #a9c4cf;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: radial-gradient(ellipse at 50% 35%, #06161f 0%, #030b12 45%, #01060a 100%);
    font-family: ui-sans-serif, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--mist);
    user-select: none;
  }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* 星团标签走 DOM —— 中文在 canvas 里渲染质量差太多 */
  #labels { position: absolute; inset: 0; pointer-events: none; }
  .cluster-label {
    position: absolute; transform: translate(-50%, -50%);
    text-align: center; white-space: nowrap;
  }
  .cluster-label .name {
    font-size: 13px; letter-spacing: 0.32em; color: rgba(207, 239, 255, 0.62);
    text-indent: 0.32em;
  }
  .cluster-label .stat {
    margin-top: 5px; font-size: 10.5px; font-family: ui-monospace, monospace;
    color: rgba(169, 196, 207, 0.42); letter-spacing: 0.02em;
  }
  .cluster-label .bar {
    margin: 5px auto 0; width: 62px; height: 2px; border-radius: 2px;
    background: rgba(255,255,255,0.06); overflow: hidden;
  }
  .cluster-label .bar i { display: block; height: 100%; background: currentColor; opacity: 0.7; }

  /* 顶部说明 */
  #hud {
    position: absolute; left: 22px; top: 20px; pointer-events: none;
    font-size: 11px; line-height: 1.85; color: rgba(169,196,207,0.5);
  }
  #hud h1 {
    margin: 0 0 8px; font-size: 13px; letter-spacing: 0.2em;
    color: rgba(207,239,255,0.8); font-weight: 500;
  }
  #hud b { color: var(--biolum); font-weight: 500; }
  #hud .warm { color: var(--warm); }
  #hud .cold { color: var(--cold); }

  /* 图例 */
  #legend {
    position: absolute; left: 22px; bottom: 20px;
    display: flex; gap: 18px; font-size: 10.5px;
    color: rgba(169,196,207,0.42); pointer-events: none;
  }
  #legend span { display: flex; align-items: center; gap: 6px; }
  #legend i { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }

  /* 详情卡 */
  #card {
    position: absolute; pointer-events: none; opacity: 0;
    transform: translate(-50%, -100%) translateY(-14px);
    transition: opacity 0.16s ease;
    background: rgba(4, 16, 24, 0.94);
    border: 1px solid rgba(53, 240, 206, 0.22);
    border-radius: 8px; padding: 10px 12px; max-width: 280px;
    backdrop-filter: blur(8px);
    box-shadow: 0 10px 34px rgba(0,0,0,0.6);
  }
  #card.on { opacity: 1; }
  #card .t { font-size: 12px; line-height: 1.6; color: rgba(226,244,250,0.92); }
  #card .m {
    margin-top: 7px; font-size: 10px; font-family: ui-monospace, monospace;
    color: rgba(169,196,207,0.5); display: flex; gap: 10px; flex-wrap: wrap;
  }
  #card .m b { color: var(--biolum); font-weight: 500; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>

<div id="hud">
  <h1>记 忆 星 图 · 样 张</h1>
  亮度 = <b>effectiveWeight</b>　·　大小 = 被想起次数<br />
  <span class="cold">冷白</span> = 已进皮层（反复想起，稳）　
  <span class="warm">暖橙</span> = 还在海马体（新的，容易散）<br />
  点一颗星看它是什么。
</div>

<div id="legend">
  <span><i style="background:#cfefff;box-shadow:0 0 8px #cfefff"></i>皮层</span>
  <span><i style="background:#ffb46b;box-shadow:0 0 8px #ffb46b"></i>海马体</span>
  <span><i style="background:#2b3a44"></i>忘了</span>
</div>

<div id="card"><div class="t"></div><div class="m"></div></div>

<script>
/* ══════════════════════════════════════════
   假数据 —— 分布照着真实情况造
   ══════════════════════════════════════════ */
let seed = 20261103;
function rnd() { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }

const TAGS = [
  { tag: "长期", n: 34, y: 0.24, base: 0.62, spread: 0.26, cortex: 0.55,
    samples: ["他说以后一定先跟我说一声","他说他受不了香菜的味道","他答应过不会突然消失",
              "他每天早上七点会醒","他喜欢海，但没去过"] },
  { tag: "偏好", n: 27, y: 0.26, base: 0.54, spread: 0.24, cortex: 0.42,
    samples: ["他喝咖啡不加糖","他受不了太吵的地方","他喜欢在凌晨写东西",
              "他不吃动物内脏","他讨厌被催"] },
  { tag: "情绪", n: 46, y: 0.72, base: 0.19, spread: 0.15, cortex: 0.05,
    samples: ["那天海面很安静","他说他有点累","他那天笑得很勉强",
              "他一句话都没说就走了","他说他不想聊这个"] },
  { tag: "短期", n: 71, y: 0.74, base: 0.15, spread: 0.13, cortex: 0.02,
    samples: ["他说他下午开会","他问了一句几点","他说明天再说",
              "他提到一个没听过的名字","他说要去趟邮局"] },
];

const mems = [];
for (const c of TAGS) {
  for (let i = 0; i < c.n; i++) {
    const w = Math.max(0.02, Math.min(0.97, c.base + (rnd() - 0.5) * 2 * c.spread));
    const consolidated = rnd() < c.cortex;
    // 位置：皮层往核里走，海马体在外缘
    const r = consolidated ? 0.16 + rnd() * 0.3 : 0.52 + rnd() * 0.46;
    mems.push({
      tag: c.tag,
      text: c.samples[Math.floor(rnd() * c.samples.length)],
      w,
      consolidated,
      forgotten: !consolidated && w < 0.055 && rnd() < 0.55,
      accessCount: consolidated ? 3 + Math.floor(rnd() * 9) : Math.floor(rnd() * 3),
      daysAgo: Math.floor(rnd() * 120),
      ang: rnd() * Math.PI * 2,
      r,
      phase: rnd() * Math.PI * 2,
      speed: 0.5 + rnd() * 0.9,
    });
  }
}

/* ══════════════════════════════════════════
   画布
   ══════════════════════════════════════════ */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d", { alpha: true });
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layout();
}
addEventListener("resize", resize);

/* 预渲染两张 sprite —— 冷 / 暖。逐帧 shadowBlur 是 canvas 最贵的东西 */
const SPRITE = 64;
function makeSprite(r, g, b) {
  const s = document.createElement("canvas");
  s.width = s.height = SPRITE;
  const x = s.getContext("2d");
  const grad = x.createRadialGradient(SPRITE/2, SPRITE/2, 0, SPRITE/2, SPRITE/2, SPRITE/2);
  grad.addColorStop(0,    `rgba(255,255,255,0.98)`);
  grad.addColorStop(0.18, `rgba(${r},${g},${b},0.92)`);
  grad.addColorStop(0.45, `rgba(${r},${g},${b},0.30)`);
  grad.addColorStop(1,    `rgba(${r},${g},${b},0)`);
  x.fillStyle = grad;
  x.fillRect(0, 0, SPRITE, SPRITE);
  return s;
}
const SPR_COLD = makeSprite(207, 239, 255);
const SPR_WARM = makeSprite(255, 180, 107);

/* 星团中心 */
const centers = {};
function layout() {
  const padX = W < 760 ? 0.2 : 0.235;
  const xs = { 长期: padX + 0.03, 偏好: 1 - padX - 0.03 };
  const R = Math.min(W, H) * 0.205;
  for (const c of TAGS) {
    centers[c.tag] = { x: W * xs[c.tag], y: H * c.y, R };
  }
  for (const m of mems) {
    const c = centers[m.tag];
    m.x = c.x + Math.cos(m.ang) * c.R * m.r;
    m.y = c.y + Math.sin(m.ang) * c.R * m.r;
    m.rad = (m.consolidated ? 2.4 : 1.6) + Math.min(m.accessCount, 12) * 0.24;
  }
  drawLabels();
}

/* 标签 */
function drawLabels() {
  const box = document.getElementById("labels");
  box.innerHTML = "";
  for (const c of TAGS) {
    const ct = centers[c.tag];
    const list = mems.filter((m) => m.tag === c.tag);
    const avg = list.reduce((s, m) => s + m.w, 0) / (list.length || 1);
    const pct = Math.round(avg * 100);
    const hue = avg > 0.45 ? "207,239,255" : "255,180,107";

    const d = document.createElement("div");
    d.className = "cluster-label";
    d.style.left = ct.x + "px";
    d.style.top = (ct.y - ct.R * 1.28) + "px";
    d.style.color = `rgb(${hue})`;
    d.innerHTML =
      `<div class="name">${c.tag}</div>` +
      `<div class="stat">${list.length} 条 · 平均 ${avg.toFixed(2)}</div>` +
      `<div class="bar"><i style="width:${pct}%"></i></div>`;
    box.appendChild(d);
  }
}

/* 帧循环 */
const card = document.getElementById("card");
let hovered = null, mouse = { x: -999, y: -999 };

cv.addEventListener("mousemove", (e) => {
  const r = cv.getBoundingClientRect();
  mouse.x = e.clientX - r.left;
  mouse.y = e.clientY - r.top;
});
cv.addEventListener("click", (e) => {
  const r = cv.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  let best = null, bestD = 16;
  for (const m of mems) {
    const d = Math.hypot(m.x - x, m.y - y);
    if (d < bestD) { bestD = d; best = m; }
  }
  if (!best) { card.classList.remove("on"); return; }
  card.querySelector(".t").textContent = best.text;
  card.querySelector(".m").innerHTML =
    `<span>${best.tag}</span>` +
    `<span>权重 <b>${best.w.toFixed(2)}</b></span>` +
    `<span>${best.forgotten ? "已忘" : best.consolidated ? "皮层" : "海马体"}</span>` +
    `<span>想起 ${best.accessCount} 次</span>` +
    `<span>${best.daysAgo} 天前</span>`;
  card.style.left = best.x + "px";
  card.style.top = best.y + "px";
  card.classList.add("on");
});

let t0 = performance.now();
function frame(now) {
  const t = (now - t0) / 1000;
  ctx.clearRect(0, 0, W, H);

  /*
   * additive 叠加 —— 星星挨在一起会互相照亮。
   * 这是「一片星云」和「一堆独立圆点」的区别。
   */
  ctx.globalCompositeOperation = "lighter";

  for (const m of mems) {
    /* 忘掉的星：留在原地，压到极暗，不删除 */
    let b = m.forgotten ? 0.05 : m.w;

    /* 呼吸 —— 幅度很小，不然像圣诞灯 */
    b *= 1 + 0.14 * Math.sin(t * m.speed + m.phase);

    /* 极慢的漂移，让图是活的 */
    const drift = 2.2 * m.r;
    const dx = Math.cos(t * 0.07 + m.ang) * drift;
    const dy = Math.sin(t * 0.05 + m.ang * 1.7) * drift;

    const size = m.rad * 3.4;
    const a = Math.max(0, Math.min(1, b));
    ctx.globalAlpha = a * (m.consolidated ? 0.95 : 0.8);
    ctx.drawImage(
      m.consolidated ? SPR_COLD : SPR_WARM,
      m.x + dx - size / 2, m.y + dy - size / 2, size, size
    );

    /* 悬停高亮 */
    if (Math.hypot(m.x + dx - mouse.x, m.y + dy - mouse.y) < 12) {
      ctx.globalAlpha = 0.9;
      const s2 = size * 2.6;
      ctx.drawImage(SPR_COLD, m.x + dx - s2 / 2, m.y + dy - s2 / 2, s2, s2);
    }
  }

  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "source-over";
  requestAnimationFrame(frame);
}

resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
