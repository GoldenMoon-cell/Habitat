<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>生境 · 自制西文字体试样</title>
<style>
  :root {
    --bg: #04080c; --ink: #e6f2fb; --mist: #8fa9bd;
    --biolum: #35f0ce; --dim: #2a3b46;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink); padding: 48px 56px 80px;
    font-family: ui-monospace, Consolas, monospace; font-size: 13px;
    -webkit-font-smoothing: antialiased;
  }
  h2 {
    font-size: 10px; letter-spacing: .34em; color: var(--biolum);
    font-weight: 400; margin: 44px 0 18px; text-transform: uppercase;
  }
  h2:first-of-type { margin-top: 0; }
  .note { font-size: 11px; color: var(--mist); opacity: .65; margin: -10px 0 18px; line-height: 1.9; }

  .grid { display: flex; flex-wrap: wrap; gap: 10px; }
  .cell {
    display: flex; flex-direction: column; align-items: center;
    width: 66px; padding: 8px 0 6px;
    border: 1px solid rgba(255,255,255,.05); border-radius: 4px;
  }
  .cell span { font-size: 9px; color: var(--dim); margin-top: 4px; }
  svg { display: block; overflow: visible; }

  .rowed { display: flex; flex-direction: column; gap: 22px; }
  .row { display: flex; align-items: baseline; gap: 28px; }
  .row .tag { width: 120px; font-size: 10px; letter-spacing: .2em; color: var(--dim); flex: none; }
  .row .old { color: var(--mist); opacity: .38; }
  .row .grp { display: flex; gap: 34px; align-items: baseline; }

  .rule { height: 1px; background: rgba(255,255,255,.07); margin: 34px 0; }
</style>
</head>
<body>

<h2>字形 · 大写</h2>
<div class="grid" id="upper"></div>

<h2>字形 · 数字</h2>
<div class="grid" id="digits"></div>

<h2>字形 · 小写</h2>
<div class="grid" id="lower"></div>

<h2>实际用法</h2>
<div class="rowed" id="usage"></div>

<h2>对照 · 现在是 Consolas</h2>
<div class="note">下面灰的是当前字体，亮的是自制的。宽度都是 600 单位。</div>
<div class="rowed" id="compare"></div>

<script>

const STROKE = 84;
const ADV = 780;                      // 等宽步进（字形 600 宽 + 左右各 90 侧距）

  C: [[[6,7],[1.5,7],[0,5.5],[0,1.5],[1.5,0],[6,0]]],

  J: [[[6,7],[6,1.5],[4.5,0],[1.5,0],[0,1.5]]],
  K: [[[0,0],[0,7]], [[6,7],[0,3.1]], [[2.1,4.1],[6,0]]],

  T: [[[0,7],[6,7]], [[3,7],[3,0]]],
  U: [[[0,7],[0,1.5],[1.5,0],[4.5,0],[6,1.5],[6,7]]],
  V: [[[0,7],[3,0],[6,7]]],
  W: [[[0.3,7],[1.6,0],[3,3.7],[4.4,0],[5.7,7]]],

  Y: [[[0,7],[3,3.5],[6,7]], [[3,3.5],[3,0]]],
  Z: [[[0,7],[6,7],[0,0],[6,0]]],

  0: [[[1.5,7],[4.5,7],[6,5.5],[6,1.5],[4.5,0],[1.5,0],[0,1.5],[0,5.5],[1.5,7]], [[1.1,5.3],[4.9,1.7]]],
  1: [[[1.3,5.5],[3,7],[3,0]], [[1.2,0],[4.9,0]]],
  2: [[[0,5.5],[1.5,7],[4.5,7],[6,5.5],[6,4.3],[0,0],[6,0]]],
  3: [[[0,7],[5.2,7],[2.9,4.1],[4.9,4.1],[6,2.9],[6,1.4],[4.5,0],[0,0]]],
  4: [[[4.5,0],[4.5,7],[0,2.1],[6,2.1]]],
  5: [[[6,7],[0,7],[0,4.1],[4.5,4.1],[6,2.9],[6,1.4],[4.5,0],[0,0]]],

  7: [[[0,7],[6,7],[2.5,0]]],
  8: [[[1.5,3.6],[0,4.8],[0,5.5],[1.5,7],[4.5,7],[6,5.5],[6,4.8],[4.5,3.6],[1.5,3.6],[0,2.4],[0,1.5],[1.5,0],[4.5,0],[6,1.5],[6,2.4],[4.5,3.6]]],
  9: [[[0,0],[4.5,0],[6,1.5],[6,5.5],[4.5,7],[1.5,7],[0,5.5],[0,4.3],[1.5,2.9],[6,2.9]]],

  a: [[[0.5,3.1],[1.5,3.6],[4.4,3.6],[5.4,2.7],[5.4,0]], [[5.4,1.9],[1.6,1.9],[0.5,1.3],[0.5,0.6],[1.5,0],[5.4,0]]],
  b: [[[0.6,6.4],[0.6,0]], [[0.6,3.4],[4.4,3.4],[5.6,2.4],[5.6,1.0],[4.4,0],[0.6,0]]],
  c: [[[5.6,3.6],[1.4,3.6],[0.5,2.8],[0.5,0.8],[1.4,0],[5.6,0]]],
  d: [[[5.4,6.4],[5.4,0]], [[5.4,3.4],[1.6,3.4],[0.4,2.4],[0.4,1.0],[1.6,0],[5.4,0]]],
  e: [[[0.5,1.9],[5.5,1.9],[5.5,2.7],[4.6,3.6],[1.4,3.6],[0.5,2.7],[0.5,0.9],[1.4,0],[5.5,0]]],
  f: [[[5.2,6.4],[2.4,6.4],[1.6,5.6],[1.6,0]], [[0.2,3.6],[4.4,3.6]]],

  p: [[[0.6,3.6],[0.6,-1.6]], [[0.6,3.4],[4.4,3.4],[5.6,2.4],[5.6,1.0],[4.4,0],[0.6,0]]],
  q: [[[5.4,3.6],[5.4,-1.6]], [[5.4,3.4],[1.6,3.4],[0.4,2.4],[0.4,1.0],[1.6,0],[5.4,0]]],
  r: [[[0.6,3.6],[0.6,0]], [[0.6,3.0],[3.4,3.6],[5.4,3.4]]],
  s: [[[5.4,3.6],[1.4,3.6],[0.5,2.9],[0.5,2.4],[1.4,1.8],[4.4,1.8],[5.5,1.0],[5.5,0.6],[4.6,0],[0.5,0]]],
  t: [[[2.4,5.4],[2.4,0.8],[3.4,0],[5.2,0]], [[0.8,3.6],[4.6,3.6]]],
  u: [[[0.6,3.6],[0.6,0.9],[1.6,0],[4.4,0],[5.4,0.9]], [[5.4,3.6],[5.4,0]]],
  v: [[[0.5,3.6],[3,0],[5.5,3.6]]],
  w: [[[0.3,3.6],[1.4,0],[3,2.4],[4.6,0],[5.7,3.6]]],
  x: [[[0.6,3.6],[5.4,0]], [[5.4,3.6],[0.6,0]]],
  y: [[[0.6,3.6],[3,0.4]], [[5.4,3.6],[2.0,-1.6]]],

const PUNCT = {
  ".": [[[2.7,0],[3.3,0]]],
  ",": [[[3.2,0.5],[2.4,-1.2]]],
  ":": [[[2.9,3.4],[3.5,3.4]], [[2.9,0.6],[3.5,0.6]]],
  "·": [[[2.9,2.2],[3.5,2.2]]],
  "/": [[[0.4,-0.3],[5.6,7.3]]],
  "-": [[[1.2,3.2],[4.8,3.2]]],
  "+": [[[3,1.2],[3,5.2]], [[1,3.2],[5,3.2]]],
  "%": [[[0.4,0.4],[5.6,6.6]], [[1.6,6.4],[2.6,6.4],[2.6,5.4],[1.6,5.4],[1.6,6.4]], [[3.4,1.6],[4.4,1.6],[4.4,0.6],[3.4,0.6],[3.4,1.6]]],
  " ": [],
};

/* 把网格折线画成 SVG */
function draw(ch, size = 30) {
  const strokes = G[ch] || PUNCT[ch] || [];
  const scale = size / 9.6;                       // 7 高 + 上下留白
  const pad = 0.5;
  const vb = `${-pad*U} ${-1.9*U} ${(W+pad*2)*U} ${(H+1.9+0.6)*U}`;
  let d = "";
  for (const poly of strokes) {
    d += poly.map(([x, y], i) => `${i ? "L" : "M"}${x*U} ${(H - y)*U}`).join(" ") + " ";
  }
  return `<svg width="${size*(W+1)/8}" height="${size*(H+2.5)/7}" viewBox="${vb}">
    <path d="${d}" fill="none" stroke="currentColor" stroke-width="${STROKE}"
      stroke-linecap="square" stroke-linejoin="miter" stroke-miterlimit="2"/>
  </svg>`;
}

/* ── 渲染 ── */
const up = document.getElementById("upper");
for (const ch of "ABCDEFGHIJKLMNOPQRSTUVWXYZ") {
  up.insertAdjacentHTML("beforeend",
    `<div class="cell">${draw(ch, 34)}<span>${ch}</span></div>`);
}
const dg = document.getElementById("digits");
for (const ch of "0123456789") {
  dg.insertAdjacentHTML("beforeend",
    `<div class="cell">${draw(ch, 34)}<span>${ch}</span></div>`);
}
const lo = document.getElementById("lower");
for (const ch of "abcdefghijklmnopqrstuvwxyz") {
  lo.insertAdjacentHTML("beforeend",
    `<div class="cell">${draw(ch, 34)}<span>${ch}</span></div>`);
}

/* 把一串文字画成一行 SVG（等宽排版） */
function line(text, size = 26, color = "currentColor") {
  let x = 0;
  let inner = "";
  for (const ch of text) {
    const strokes = G[ch] || PUNCT[ch] || [];
    const s = size / 9.6;
    for (const poly of strokes) {
      const dd = poly.map(([px, py], i) => `${i ? "L" : "M"}${px*U} ${(H - py)*U}`).join(" ");
      inner += `<path d="${dd}" fill="none" stroke="${color}" stroke-width="${STROKE}"
        stroke-linecap="square" stroke-linejoin="miter" stroke-miterlimit="2"
        transform="translate(${x},0)"/>`;
    }
    x += ADV;
  }
  const vb = `-60 ${-1.9*U} ${x + 120} ${(H + 2.6) * U}`;
  const h = size * (H + 2.6) / 7;
  const w = (x + 120) / (H + 2.6) * (size / 7) * 7 / 7;
  return `<svg height="${size*(H+2.6)/7}" viewBox="${vb}" style="width:auto">
    <g fill="none" stroke-linecap="square" stroke-linejoin="miter" stroke-miterlimit="2">${inner}</g>
  </svg>`;
}

const usage = document.getElementById("usage");
const SAMPLES = [
  ["标题", "HABITAT"],
  ["副标", "SEDIMENT"],
  ["副标", "SYSTEMIC ECOSYSTEM FOR AGENTS"],
  ["引擎", "DeepSeek  OpenAI  Claude  Gemini"],
  ["引擎", "Qwen  Kimi  Grok  ChatGPT"],
  ["模型", "gpt-5  claude-sonnet-4.6  deepseek-v3.2"],
  ["系统", "ADDR  FRAME  BASE URL  API KEY"],
  ["系统", "0x7FF8A0C2  current.json  v0.1.0"],
  ["按键", "Esc  Ctrl+M  Ctrl+B  Enter  Shift+Enter"],
];
for (const [tag, text] of SAMPLES) {
  usage.insertAdjacentHTML("beforeend",
    `<div class="row"><span class="tag">${tag}</span>
       <div style="color:var(--ink)">${line(text, 17)}</div></div>`);
}

const cmp = document.getElementById("compare");
const CMP = ["HABITAT", "SEDIMENT", "DeepSeek", "0x7FF8A0C2", "Ctrl+M"];
for (const text of CMP) {
  cmp.insertAdjacentHTML("beforeend",
    `<div class="row">
      <span class="old" style="font-family:Consolas,monospace;font-size:17px;letter-spacing:.08em;width:210px">${text}</span>
      <span style="color:var(--biolum)">${line(text, 17, "#35f0ce")}</span>
    </div>`);
}
</script>
</body>
</html>
