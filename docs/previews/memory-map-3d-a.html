<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>生境 · 记忆星图 · 方案 A（Canvas 2D 透视投影）</title>
<style>
  :root { --cold:#cfefff; --warm:#ffb46b; --mist:#a9c4cf; --biolum:#35f0ce; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;user-select:none;
    background:radial-gradient(ellipse at 50% 46%,#071a24 0%,#030c13 46%,#000305 100%);
    font-family:ui-sans-serif,system-ui,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--mist)}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
  canvas:active{cursor:grabbing}
  #hud{position:absolute;left:22px;top:20px;pointer-events:none;font-size:11px;line-height:1.9;color:rgba(169,196,207,.5)}
  #hud h1{margin:0 0 8px;font-size:13px;letter-spacing:.2em;color:rgba(207,239,255,.82);font-weight:500}
  #hud b{color:var(--biolum);font-weight:500}
  #hud .c{color:var(--cold)} #hud .w{color:var(--warm)}
  #legend{position:absolute;left:22px;bottom:20px;display:flex;gap:18px;font-size:10.5px;color:rgba(169,196,207,.42);pointer-events:none}
  #legend span{display:flex;align-items:center;gap:6px}
  #legend i{width:6px;height:6px;border-radius:50%;display:inline-block}
  #card{position:absolute;pointer-events:none;opacity:0;transition:opacity .16s ease;
    transform:translate(-50%,-100%) translateY(-16px);
    background:rgba(4,16,24,.94);border:1px solid rgba(53,240,206,.24);border-radius:8px;
    padding:10px 12px;max-width:290px;backdrop-filter:blur(8px);box-shadow:0 12px 40px rgba(0,0,0,.65)}
  #card.on{opacity:1}
  #card .t{font-size:12px;line-height:1.6;color:rgba(226,244,250,.93)}
  #card .m{margin-top:7px;font-size:10px;font-family:ui-monospace,monospace;color:rgba(169,196,207,.5);display:flex;gap:10px;flex-wrap:wrap}
  #card .m b{color:var(--biolum);font-weight:500}
  #tip{position:absolute;right:22px;bottom:20px;font-size:10.5px;color:rgba(169,196,207,.3);pointer-events:none}
  #tag{position:absolute;right:22px;top:20px;font-family:ui-monospace,monospace;font-size:10px;
    padding:4px 9px;border-radius:5px;border:1px solid rgba(53,240,206,.28);color:var(--biolum);opacity:.8}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <h1>记 忆 星 图 · 方 案 A</h1>
  Canvas 2D + 透视投影　·　**零依赖**<br />
  中心 = 她　·　<b>距离 = 权重</b>（越牢越近）· 深度 = 遗忘（越沉越暗）<br />
  <span class="c">冷白</span> = 皮层　<span class="w">暖橙</span> = 海马体　·　**不连线**
</div>

<div id="tag">A · Canvas 2D</div>

<div id="legend">
  <span><i style="background:#cfefff;box-shadow:0 0 8px #cfefff"></i>皮层</span>
  <span><i style="background:#ffb46b;box-shadow:0 0 8px #ffb46b"></i>海马体</span>
  <span><i style="background:#243440"></i>忘了</span>
</div>

<div id="card"><div class="t"></div><div class="m"></div></div>
<div id="tip">拖动旋转 · 松手回到自动轨道</div>

<script>
/* ═════════ 数据（A / B 共用同一套种子） ═════════ */
let seed = 20261103;
const rnd = () => (seed = (seed*1664525 + 1013904223) % 4294967296) / 4294967296;

const TAGS = [
  { tag:"长期", n:34, az:0.79, base:.66, spread:.24, cortex:.58 },
  { tag:"偏好", n:27, az:2.36, base:.56, spread:.22, cortex:.45 },
  { tag:"情绪", n:46, az:3.93, base:.20, spread:.14, cortex:.06 },
  { tag:"短期", n:71, az:5.50, base:.15, spread:.12, cortex:.02 },
];
const S = ["他说以后一定先跟我说一声","他说他受不了香菜的味道","他答应过不会突然消失",
  "那天海面很安静","他说他有点累","他喝咖啡不加糖","他喜欢在凌晨写东西",
  "他一句话都没说就走了","他说他下午开会","他问了一句几点"];

const mems = [];
for (const c of TAGS) {
  for (let i=0;i<c.n;i++){
    const w = Math.max(.03, Math.min(.96, c.base + (rnd()-.5)*2*c.spread));
    const consolidated = rnd() < c.cortex;
    const sink = 1 - w;                       /* 越没权重越沉 */
    mems.push({
      tag:c.tag, text:S[Math.floor(rnd()*S.length)], w, consolidated,
      forgotten: !consolidated && w < .06 && rnd() < .5,
      accessCount: consolidated ? 3+Math.floor(rnd()*9) : Math.floor(rnd()*3),
      daysAgo: Math.floor(rnd()*120),
      az: c.az + (rnd()-.5)*.70,
      /* ★ 半径 = 权重：权重高 → 靠中心 */
      rad: 0.10 + sink*0.92,
      /* ★ 深度 = 权重：权重低 → 沉下去 */
      z: .18 - sink*1.55,
      phase: rnd()*Math.PI*2, speed:.5+rnd()*.9,
    });
  }
}
/* ── 按排名铺开，而不是按权重线性映射 ──
 * 线性映射会让大部分低权重记忆挤在外圈同一半径上，变成一道薄环。
 * 按排名分配：最亮的贴中心，最暗的在最外，中间均匀铺开。 */
{
  const order = mems.slice().sort((a, b) => b.w - a.w);
  const n = order.length;
  order.forEach((m, i) => {
    const f = n > 1 ? i / (n - 1) : 0;
    m.rad = 0.11 + f * 0.95 + (rnd() - .5) * 0.10;
    m.z   = 0.25 - f * 1.75 + (rnd() - .5) * 0.35;
  });
}

const AVATAR = "鲸";   /* 中心那个字 —— 现在用 avatarMark(name) 生成 */

/* ═════════ 画布 ═════════ */
const cv=document.getElementById('c'), ctx=cv.getContext('2d',{alpha:true});
let W=0,H=0,DPR=1;
const FOCAL = 2.9;

const SPRITE=64;
function sprite(r,g,b){
  const s=document.createElement('canvas'); s.width=s.height=SPRITE;
  const x=s.getContext('2d');
  const gd=x.createRadialGradient(32,32,0,32,32,32);
  gd.addColorStop(0,'rgba(255,255,255,.99)');
  gd.addColorStop(.15,`rgba(${r},${g},${b},.94)`);
  gd.addColorStop(.42,`rgba(${r},${g},${b},.26)`);
  gd.addColorStop(1,`rgba(${r},${g},${b},0)`);
  x.fillStyle=gd; x.fillRect(0,0,SPRITE,SPRITE);
  return s;
}
const SP_COLD=sprite(207,239,255), SP_WARM=sprite(255,180,107), SP_CORE=sprite(160,255,235);

function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=cv.clientWidth; H=cv.clientHeight;
  cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize);

/* ═════════ 相机 ═════════ */
let yaw=0, pitch=-0.26, dragging=false, lx=0, ly=0, idle=9;
cv.addEventListener('pointerdown',e=>{dragging=true;lx=e.clientX;ly=e.clientY;idle=0});
addEventListener('pointerup',()=>dragging=false);
addEventListener('pointermove',e=>{
  if(!dragging)return;
  yaw+=(e.clientX-lx)*.006; pitch+=(e.clientY-ly)*.004;
  pitch=Math.max(-1.0,Math.min(.6,pitch));
  lx=e.clientX; ly=e.clientY; idle=0;
});

function project(px,py,pz,SC){
  const cy=Math.cos(yaw), sy=Math.sin(yaw);
  let x1=px*cy - pz*sy, z1=px*sy + pz*cy;
  const cp=Math.cos(pitch), sp=Math.sin(pitch);
  let y1=py*cp - z1*sp, z2=py*sp + z1*cp;
  const s=FOCAL/(FOCAL+z2);
  return { x:W/2 + x1*SC*s, y:H/2 + y1*SC*s, s, z:z2 };
}

/* ═════════ 循环 ═════════ */
const card=document.getElementById('card');
let hover={x:-999,y:-999};
cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();hover.x=e.clientX-r.left;hover.y=e.clientY-r.top});
let screen=[];
cv.addEventListener('click',e=>{
  const r=cv.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
  let best=null,bd=18;
  for(const p of screen){ const d=Math.hypot(p.x-x,p.y-y); if(d<bd){bd=d;best=p.m} }
  if(!best){card.classList.remove('on');return}
  card.querySelector('.t').textContent=best.text;
  card.querySelector('.m').innerHTML=
    `<span>${best.tag}</span><span>权重 <b>${best.w.toFixed(2)}</b></span>`+
    `<span>${best.forgotten?'已忘':best.consolidated?'皮层':'海马体'}</span>`+
    `<span>想起 ${best.accessCount} 次</span><span>${best.daysAgo} 天前</span>`;
  card.style.left=x+'px'; card.style.top=y+'px'; card.classList.add('on');
});

const t0=performance.now();
function frame(now){
  const t=(now-t0)/1000;

  if(!dragging){ idle+=1/60; if(idle>2.2){ yaw+=0.0017; pitch+=(-0.26-pitch)*0.012; } }

  ctx.clearRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';

  const SC=Math.min(W,H)*0.52;

  /* 中心：她 */
  const core=project(0,0,0,SC);
  const pulse=1+0.10*Math.sin(t*0.9);
  const cs=120*core.s*pulse;
  ctx.globalAlpha=0.42;
  ctx.drawImage(SP_CORE, core.x-cs/2, core.y-cs/2, cs, cs);
  ctx.globalAlpha=0.95;
  const cs2=30*core.s*pulse;
  ctx.drawImage(SP_CORE, core.x-cs2/2, core.y-cs2/2, cs2, cs2);

  /* 星 */
  const pts=[];
  for(const m of mems){
    const wob=Math.sin(t*.20+m.phase)*.035;
    const px=Math.cos(m.az+wob)*m.rad;
    const py=Math.sin(m.az+wob)*m.rad*0.62;
    const pz=m.z+Math.sin(t*.11+m.phase)*.03;
    const p=project(px,py,pz,SC);
    p.m=m; pz2=pz;
    pts.push(p);
  }
  pts.sort((a,b)=>b.z-a.z);

  screen=[];
  for(const p of pts){
    const m=p.m;
    let b = m.forgotten ? .06 : (0.22 + m.w * 0.78);
    b *= 1 + .14*Math.sin(t*m.speed+m.phase);
    b *= Math.pow(p.s,1.6);                 /* 越远越暗 */
    if(p.z>1.6) continue;
    const size=((m.consolidated?2.4:1.6)+Math.min(m.accessCount,12)*.22)*3.7*p.s;
    ctx.globalAlpha=Math.max(0,Math.min(1, b*(m.consolidated?.95:.82)));
    ctx.drawImage(m.consolidated?SP_COLD:SP_WARM, p.x-size/2, p.y-size/2, size, size);

    if(Math.hypot(p.x-hover.x,p.y-hover.y)<13){
      ctx.globalAlpha=.85; const s2=size*2.7;
      ctx.drawImage(SP_COLD,p.x-s2/2,p.y-s2/2,s2,s2);
    }
    screen.push(p);
  }

  /* 中心那个字 —— 用 DOM 更好读，但这里跟着投影走，画在 canvas 上更贴 */
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=0.92;
  ctx.fillStyle='rgba(226,255,250,'+(0.62+0.12*Math.sin(t*0.9))+')';
  ctx.font=`${Math.round(15*core.s*pulse)}px ui-sans-serif, system-ui, "PingFang SC"`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(AVATAR, core.x, core.y - 0.5);

  ctx.globalAlpha=1;
  requestAnimationFrame(frame);
}
resize(); requestAnimationFrame(frame);
</script>
</body>
</html>
