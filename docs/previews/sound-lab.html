<script>
/* ══════════════════════ 和 src/lib/sound.ts 完全同源 ══════════════════════ */
let ctx = null;
function getCtx() {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === "suspended") ctx.resume();
  return ctx;
}

function tone(ac, o) {
  const { freq, to, type = "sine", gain = 0.1, attack = 0.01, decay = 0.2, delay = 0, dest } = o;
  const t0 = ac.currentTime + delay;
  const osc = ac.createOscillator();
  const g = ac.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, to), t0 + attack + decay);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, gain), t0 + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + attack + decay);
  osc.connect(g).connect(dest ?? ac.destination);
  osc.start(t0);
  osc.stop(t0 + attack + decay + 0.05);
}

function noise(ac, o) {
  const { dur, gain = 0.06, cutoff = 800, delay = 0, dest, fade = true } = o;
  const t0 = ac.currentTime + delay;
  const len = Math.floor(ac.sampleRate * dur);
  if (len <= 0) return;
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (fade ? 1 - i / len : 1);
  const src = ac.createBufferSource();
  src.buffer = buf;
  const lp = ac.createBiquadFilter();
  lp.type = "lowpass";
  lp.frequency.value = cutoff;
  const g = ac.createGain();
  g.gain.value = gain;
  src.connect(lp).connect(g).connect(dest ?? ac.destination);
  src.start(t0);
  src.stop(t0 + dur);
}

function reverbBus(ac, seconds = 2.2, decay = 2.4, wet = 0.34) {
  const rate = ac.sampleRate;
  const len = Math.max(1, Math.floor(rate * seconds));
  const buf = ac.createBuffer(2, len, rate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) {
      const p = i / len;
      const env = p < 0.08 ? p / 0.08 : Math.pow(1 - p, decay);
      d[i] = (Math.random() * 2 - 1) * env;
    }
  }
  const conv = ac.createConvolver(); conv.buffer = buf;
  const dry = ac.createGain(); dry.gain.value = 1;
  const wetGain = ac.createGain(); wetGain.gain.value = wet;
  const input = ac.createGain();
  input.connect(dry).connect(ac.destination);
  input.connect(conv).connect(wetGain).connect(ac.destination);
  return input;
}

const SOUNDS = {
  roots() {
    const ac = getCtx();
    const bus = reverbBus(ac, 2.6, 2.0, 0.42);
    [[0.0,262,0.05],[0.4,392,0.055],[0.9,523,0.06],[1.4,659,0.065],[2.0,784,0.075]].forEach(([at,f,g]) => {
      tone(ac, { freq: f, type:"sine", gain: g, attack: 0.42, decay: 2.6, delay: at, dest: bus });
      tone(ac, { freq: f/2, type:"sine", gain: g*0.32, attack: 0.5, decay: 2.4, delay: at, dest: bus });
    });
    noise(ac, { dur: 3.2, gain: 0.012, cutoff: 4200, dest: bus });
    tone(ac, { freq: 1046, type:"sine", gain: 0.022, attack: 0.06, decay: 1.4, delay: 2.55, dest: bus });
  },
  boot() {
    const ac = getCtx();
    const bus = reverbBus(ac, 2.4, 2.2, 0.36);
    [[523,0.07],[784,0.045],[1046,0.03]].forEach(([f,g]) => {
      tone(ac, { freq: f, type:"sine", gain: g, attack: 0.014, decay: 1.3, dest: bus });
    });
  },
  enterCreator() {
    const ac = getCtx();
    const bus = reverbBus(ac, 1.8, 2.6, 0.3);
    tone(ac, { freq: 330, to: 165, type:"sine", gain: 0.14, attack: 0.02, decay: 0.85, dest: bus });
    tone(ac, { freq: 331.5, to: 166, type:"sine", gain: 0.075, attack: 0.02, decay: 0.85, dest: bus });
    noise(ac, { dur: 0.85, gain: 0.035, cutoff: 900, dest: bus });
  },
  leaveCreator() {
    const ac = getCtx();
    const bus = reverbBus(ac, 1.4, 2.4, 0.26);
    tone(ac, { freq: 196, to: 392, type:"sine", gain: 0.11, attack: 0.015, decay: 0.5, dest: bus });
    tone(ac, { freq: 294, to: 588, type:"sine", gain: 0.05, attack: 0.015, decay: 0.42, delay: 0.06, dest: bus });
  },
  rumble() {
    const ac = getCtx(), t0 = ac.currentTime;
    const bus = reverbBus(ac, 3.4, 1.8, 0.44);
    [[82,"sine",0.34],[82.7,"sine",0.22],[123,"sine",0.16],[164,"triangle",0.07]].forEach(([f,ty,gn]) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = ty;
      o.frequency.setValueAtTime(f, t0);
      o.frequency.linearRampToValueAtTime(f * 0.9, t0 + 2.8);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(gn, t0 + 0.22);
      g.gain.linearRampToValueAtTime(gn * 0.55, t0 + 2.4);
      g.gain.linearRampToValueAtTime(0.0001, t0 + 3.3);
      o.connect(g).connect(bus);
      o.start(t0); o.stop(t0 + 3.4);
    });
    noise(ac, { dur: 3.0, gain: 0.03, cutoff: 700, dest: bus });
  },
  tick() { tone(getCtx(), { freq: 2200, to: 1320, type:"square", gain: 0.038, attack: 0.002, decay: 0.05 }); },
  send() {
    const ac = getCtx();
    tone(ac, { freq: 880, to: 1320, type:"sine", gain: 0.03, attack: 0.004, decay: 0.085 });
    tone(ac, { freq: 1760, to: 2640, type:"sine", gain: 0.012, attack: 0.003, decay: 0.06 });
  },
  receive() {
    const ac = getCtx();
    const bus = reverbBus(ac, 1.2, 2.6, 0.2);
    tone(ac, { freq: 660, type:"sine", gain: 0.058, attack: 0.008, decay: 0.42, dest: bus });
    tone(ac, { freq: 990, type:"sine", gain: 0.02, attack: 0.008, decay: 0.28, delay: 0.02, dest: bus });
  },
  switch() {
    const ac = getCtx();
    const bus = reverbBus(ac, 0.9, 3.0, 0.16);
    tone(ac, { freq: 698, to: 1046, type:"sine", gain: 0.032, attack: 0.004, decay: 0.11, dest: bus });
    tone(ac, { freq: 1046, to: 1568, type:"sine", gain: 0.016, attack: 0.003, decay: 0.09, delay: 0.04, dest: bus });
  },
  consoleOpen() {
    const ac = getCtx();
    tone(ac, { freq: 220, to: 200, type:"sine", gain: 0.055, attack: 0.004, decay: 0.09 });
    tone(ac, { freq: 1320, type:"square", gain: 0.014, attack: 0.001, decay: 0.018 });
  },
  consoleClose() {
    tone(getCtx(), { freq: 440, to: 200, type:"sine", gain: 0.05, attack: 0.003, decay: 0.1 });
  },
  panelOpen() {
    const ac = getCtx();
    const bus = reverbBus(ac, 0.6, 3.0, 0.15);
    tone(ac, { freq: 380, to: 560, type:"triangle", gain: 0.038, attack: 0.008, decay: 0.14, dest: bus });
  },
  panelClose() {
    const ac = getCtx();
    const bus = reverbBus(ac, 0.6, 3.0, 0.15);
    tone(ac, { freq: 560, to: 380, type:"triangle", gain: 0.034, attack: 0.006, decay: 0.12, dest: bus });
  },
  open() { tone(getCtx(), { freq: 420, to: 640, type:"sine", gain: 0.032, attack: 0.008, decay: 0.15 }); },
  close() { tone(getCtx(), { freq: 640, to: 420, type:"sine", gain: 0.03, attack: 0.006, decay: 0.13 }); },
  deny() {
    const ac = getCtx();
    tone(ac, { freq: 330, type:"triangle", gain: 0.026, attack: 0.004, decay: 0.09 });
    tone(ac, { freq: 294, type:"triangle", gain: 0.022, attack: 0.004, decay: 0.11, delay: 0.09 });
  },
  birth() {
    const ac = getCtx();
    tone(ac, { freq: 330, to: 495, type:"triangle", gain: 0.05, attack: 0.01, decay: 0.28 });
    tone(ac, { freq: 660, type:"sine", gain: 0.026, attack: 0.008, decay: 0.32, delay: 0.06 });
  },
  delete() {
    const ac = getCtx();
    tone(ac, { freq: 330, to: 165, type:"sine", gain: 0.055, attack: 0.006, decay: 0.34 });
    noise(ac, { dur: 0.22, gain: 0.012, cutoff: 1200, delay: 0.04 });
  },
  settle() {
    const ac = getCtx();
    [1046, 880, 740, 622].forEach((hz, i) => {
      tone(ac, { freq: hz, type:"triangle", gain: 0.032 - i*0.004, attack: 0.004, decay: 0.09, delay: i*0.07 });
    });
  },
  shift() {
    const ac = getCtx();
    tone(ac, { freq: 880, type:"square", gain: 0.028, attack: 0.001, decay: 0.02 });
    tone(ac, { freq: 1320, type:"square", gain: 0.016, attack: 0.001, decay: 0.015 });
  },
  hold() {
    const ac = getCtx();
    tone(ac, { freq: 200, to: 180, type:"sine", gain: 0.048, attack: 0.004, decay: 0.07 });
    noise(ac, { dur: 0.04, gain: 0.01, cutoff: 900 });
  },
  release() {
    tone(getCtx(), { freq: 1200, type:"triangle", gain: 0.034, attack: 0.001, decay: 0.05 });
  },
  error() {
    const ac = getCtx();
    for (let i = 0; i < 3; i++) {
      const at = i * 0.09;
      tone(ac, { freq: 1320, type:"square", gain: 0.03, attack: 0.003, decay: 0.055, delay: at });
      tone(ac, { freq: 1245, type:"square", gain: 0.02, attack: 0.003, decay: 0.055, delay: at });
    }
    tone(ac, { freq: 150, to: 140, type:"sawtooth", gain: 0.026, attack: 0.02, decay: 0.5 });
  },
};

const ITEMS = [
  { key:"roots", name:"根系生长", sub:"playRoots", kind:"", when:"启动 0-3.2s",
    where:"BootScreen.tsx:305 —— U 从种子长出枝干的那三秒",

  { key:"shift", name:"档位切换", sub:"playShift", kind:"", when:"引擎 L1 ↔ L2",
    where:"EnginePanel.tsx —— 点另一个档位",
    desc:"一个继电器声，15 毫秒。不是「过渡」，是「切换」。",
    spec:"880 + 1320Hz square · 20ms" },

  { key:"hold", name:"按住说话", sub:"playHold", kind:"", when:"按下录音",
    where:"Composer.tsx —— setRecording(true) 之前",
    desc:"一个低频的「噗」，有气压感。像把嘴凑近麦克风那一下。",
    spec:"200→180Hz + 噪声 900Hz 截止 · 70ms" },

  { key:"release", name:"松开", sub:"playRelease", kind:"", when:"松开结束录音",
    where:"Composer.tsx —— setRecording(false) 之前",
    desc:"一个高频的「嗒」。和 hold 完全相反 —— 一个往下闷，一个往上脆。",
    spec:"1200Hz triangle · 50ms" },

  { key:"error", name:"系统故障", sub:"playError", kind:"heavy", when:"API 彻底失败",
    where:"App.tsx:838 —— LLM 调用失败、且没有备用模型可换",
    desc:"警报 —— 三声急促 + 拍频刺耳 + 120Hz 一直压着。它在催你，不是通知你。",
    spec:"1320/1245Hz triangle ×3（间隔 85ms）+ 880→440Hz下沉 + 120→108Hz · 1.2s" },
];

const list = document.getElementById("list");
const state = document.getElementById("state");

ITEMS.forEach((it) => {
  const row = document.createElement("div");
  row.className = "row" + (it.kind ? " " + it.kind : "");
  row.innerHTML = `
    <span class="play">▶</span>
    <div class="meta">
      <div class="name">${it.name}<em>${it.sub}</em><span class="when">${it.when}</span></div>
      <div class="desc">${it.desc}</div>
      <div class="where">▸ ${it.where}</div>
      <div class="spec">${it.spec}</div>
    </div>
    <span class="tag">${it.kind === "heavy" ? "重" : it.kind === "up" ? "切换" : "轻"}</span>`;
  row.addEventListener("click", () => {
    SOUNDS[it.key]();
    state.textContent = "▶ " + it.sub;
  });
  list.appendChild(row);
});

document.getElementById("all").addEventListener("click", () => {
  let t = 0;
  const OFFSETS = { roots: 3400, boot: 2200, enterCreator: 1100, leaveCreator: 800, rumble: 3600, tick: 260, send: 340, receive: 700, switch: 400, consoleOpen: 260, consoleClose: 260, panelOpen: 320, panelClose: 320, deny: 300, birth: 600, delete: 600, settle: 600, shift: 200, hold: 200, release: 200, error: 600 };
  ITEMS.forEach((it) => {
    setTimeout(() => { SOUNDS[it.key](); state.textContent = "▶ " + it.sub; }, t);
    t += OFFSETS[it.key] ?? 500;
  });
});

getCtx().resume();
</script>
</body>
</html>
