<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>生境 · 启动三态演示</title>
<style>
  :root {
    --accent: #35f0ce;
    --warn: #ffc46b;
    --error: #ff7a6b;
    --bg: #04080c;
    --ink: #cfe6f2;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    margin: 0;
    background:
      radial-gradient(760px 520px at 50% 40%, rgba(53,240,206,.05), transparent 68%),
      var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }

  .splash { display: flex; flex-direction: column; align-items: center; gap: 15px; transform: translateY(-46px); }
  .mark { display: grid; place-items: center; }
  .mark svg { display: block; overflow: visible; }

  .wordmark { text-align: center; }
  .wordmark .cn { font-size: 30px; font-weight: 300; letter-spacing: .42em; text-indent: .42em; color: #e8f6ff; }
  .wordmark .en { margin-top: 8px; font-size: 9.5px; letter-spacing: .32em; text-indent: .32em; color: rgba(143,199,219,.5); }
  .wordmark .tag { margin-top: 5px; font-size: 8px; letter-spacing: .16em; color: rgba(91,120,138,.55); }

  /* ═══ 状态面板：靠 max-height 从 0 长出来 ═══ */
  .panel {
    width: 470px;
    border-radius: 9px;
    border: 1px solid transparent;
    padding: 0 16px;
    display: flex; flex-direction: column; gap: 9px;
    opacity: 0;
    transform: translateY(-8px);
    max-height: 0;
    overflow: hidden;
    transition: opacity .45s cubic-bezier(.16,1,.3,1),
                transform .45s cubic-bezier(.16,1,.3,1),
                max-height .5s cubic-bezier(.16,1,.3,1),
                padding .5s cubic-bezier(.16,1,.3,1),
                border-color .45s, background .45s;
  }
  body[data-state="warn"] .panel,
  body[data-state="error"] .panel {
    opacity: 1;
    transform: translateY(0);
    max-height: 360px;
    padding: 13px 16px;
    margin-top: 24px;
  }
  body[data-state="warn"] .panel {
    border-color: rgba(255,196,107,.32);
    background: rgba(255,196,107,.055);
  }
  body[data-state="error"] .panel {
    border-color: rgba(255,122,107,.36);
    background: rgba(255,122,107,.06);
  }
  .panel { margin-top: 0; }

  .panel-title { display: flex; align-items: center; gap: 8px; font-size: 11.5px; }
  body[data-state="warn"] .panel-title { color: var(--warn); }
  body[data-state="error"] .panel-title { color: var(--error); }
  .panel-title .dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
  body[data-state="warn"] .panel-title .dot { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
  body[data-state="error"] .panel-title .dot { background: var(--error); box-shadow: 0 0 8px var(--error); }

  .panel-body { font-size: 10px; line-height: 1.8; color: rgba(200,222,236,.62); }
  .panel-body b { color: rgba(232,246,255,.82); font-weight: 500; }
  .panel-body code {
    font-family: ui-monospace, monospace; font-size: 9px;
    background: rgba(255,255,255,.055); padding: 1px 5px; border-radius: 3px;
    color: rgba(200,230,244,.8);
  }
  .panel-body ol { margin: 5px 0 0; padding-left: 17px; }
  .panel-body li { margin-bottom: 2px; }

  .panel-actions { display: flex; gap: 8px; margin-top: 2px; flex-wrap: wrap; }
  .btn {
    padding: 5px 13px; border-radius: 5px; font-size: 10px;
    cursor: pointer; border: 1px solid; background: transparent;
    transition: background .18s;
  }
  body[data-state="warn"] .btn.primary { border-color: rgba(255,196,107,.45); color: var(--warn); }
  body[data-state="warn"] .btn.primary:hover { background: rgba(255,196,107,.13); }
  body[data-state="error"] .btn.primary { border-color: rgba(255,122,107,.45); color: var(--error); }
  body[data-state="error"] .btn.primary:hover { background: rgba(255,122,107,.13); }
  .btn.ghost { border-color: rgba(255,255,255,.12); color: rgba(200,222,236,.6); }
  .btn.ghost:hover { background: rgba(255,255,255,.05); }

  /* ═══ 进度条 ═══ */
  .bar-wrap { width: 470px; margin-top: 22px; }
  .bar { height: 1.6px; border-radius: 2px; background: rgba(255,255,255,.07); overflow: hidden; }
  .bar i {
    display: block; height: 100%; width: 0; border-radius: 2px;
    background: linear-gradient(90deg, rgba(53,240,206,.3), var(--accent));
    box-shadow: 0 0 9px rgba(53,240,206,.55);
    transition: width .6s cubic-bezier(.3,.9,.3,1), background .5s, box-shadow .5s;
  }
  body[data-state="warn"] .bar i {
    background: linear-gradient(90deg, rgba(255,196,107,.3), var(--warn));
    box-shadow: 0 0 9px rgba(255,196,107,.55);
  }
  body[data-state="error"] .bar i {
    background: linear-gradient(90deg, rgba(255,122,107,.3), var(--error));
    box-shadow: 0 0 9px rgba(255,122,107,.55);
  }
  .status {
    margin-top: 10px; text-align: center; height: 14px;
    font: 9px ui-monospace, monospace; letter-spacing: .15em;
    color: rgba(91,120,138,.65);
    transition: color .45s;
  }
  body[data-state="warn"] .status { color: rgba(255,196,107,.8); }
  body[data-state="error"] .status { color: rgba(255,122,107,.85); }

  /* ═══ U 的形态 ═══ */
  @keyframes climb {
    0%, 100% { stroke-dashoffset: 0; opacity: .22; }
    50% { stroke-dashoffset: -26; opacity: .8; }
  }
  .flow { animation: climb 3.8s linear infinite; }
  .flow-2 { animation-delay: .5s; }
  .flow-3 { animation-delay: 1s; }
  .flow-4 { animation-delay: 1.5s; }

  @keyframes breathe {
    0%, 100% { transform: scale(1); opacity: .93; }
    50% { transform: scale(1.13); opacity: 1; }
  }
  .core {
    transform-box: fill-box; transform-origin: center;
    animation: breathe 4.2s ease-in-out infinite;
    transition: opacity .9s;
  }

  .branch-group {
    transform-box: view-box;
    transform-origin: 50px 54px;
    transition: transform .9s cubic-bezier(.4,0,.3,1);
  }
  .tip { transition: opacity .9s, fill .9s; }
  .trunk, .rootline { transition: stroke .9s; }

  @keyframes climbSlow {
    0%, 100% { stroke-dashoffset: 0; opacity: .10; }
    50% { stroke-dashoffset: -18; opacity: .38; }
  }
  @keyframes blink {
    0%, 100% { opacity: .3; }
    50% { opacity: .95; }
  }
  body[data-state="warn"] .flow { animation: climbSlow 8s linear infinite; }
  body[data-state="warn"] .tip-3 { animation: blink 1.5s ease-in-out infinite; }
  body[data-state="warn"] .core { animation: breathe 8s ease-in-out infinite; }

  /* ── 失败：整株变红、枝条折断、断口之间剩丝 ── */

  /* 主干和根部也一起变红 */
  body[data-state="error"] .trunk,
  body[data-state="error"] .rootline { stroke: #ff7a6b; }

  body[data-state="error"] .flow { animation: none; opacity: .05; }
  body[data-state="error"] .core { animation: none; opacity: .34; fill: #ff7a6b; }

  /*
   * 枝条：pathLength="100" 让所有枝的长度都归一化成 100，
   * 所以一条 dasharray 就能给所有枝挖出同样比例的缺口：
   *   0–36 画实 → 36–54 空 → 54–100 画实
   */
  body[data-state="error"] .branch {
    stroke: #ff7a6b;
    opacity: .82;
    stroke-dasharray: 36 20 44;
    stroke-dashoffset: 0;
  }

  /* 下垂 + 断口错位：两段各自转一点，看起来是折了不是切了 */
  body[data-state="error"] .br-1 { transform: rotate(19deg); }
  body[data-state="error"] .br-2 { transform: rotate(-19deg); }
  body[data-state="error"] .br-3 { transform: rotate(13deg); }
  body[data-state="error"] .br-4 { transform: rotate(-13deg); }

  /* 末端节点：熄灭，也被染红 */
  /*
   * 枯叶飘落。
   *
   * 不是直线掉下去 —— 枯叶落下来是**左右摆着**落的。所以 x 先左、再右、再左，
   * 同时带旋转，最后淡出。
   *
   * 四个节点错开 0.28 秒（用 --f 变量），但顺序是**从外往里**掉：
   * 最外面那两根先落，中间两根后落 —— 熵增的样子。
   */
  body[data-state="error"] .tip {
    fill: #ff7a6b;
    opacity: .14;
    transform-box: fill-box;
    transform-origin: center;
    /*
     * 每片叶的时长不一样（--dur），四片的摆动节奏互相错开 —— 这是「不规则」的来源。
     *
     * 关键：**timing-function 用 ease-in-out 只在整段上生效一次是不够的**，
     * CSS 的缓动是逐段应用的。帧一多，每段都减速再加速，累积起来就是一顿一顿。
     *
     * 所以：帧数砍到 6 个 + 用接近匀速的 cubic-bezier，让曲线平滑而不是分段顿挫。
     * 而且**掉完就停**（infinite → 1 forwards）。
     */
    animation: leafFall var(--dur, 3.4s) cubic-bezier(.37,.08,.63,.92) 1 forwards;
    animation-delay: calc(1.1s + var(--f, 0s));
  }
  @keyframes leafFall {
    0%   { transform: translate(0, 0)        rotate(0deg);   opacity: .16; }
    18%  { transform: translate(-4.6px, 15px) rotate(-42deg); opacity: .14; }
    40%  { transform: translate(4.2px, 36px)  rotate(36deg);  opacity: .11; }
    62%  { transform: translate(-2.8px, 54px) rotate(-26deg); opacity: .07; }
    82%  { transform: translate(1.6px, 68px)  rotate(20deg);  opacity: .03; }
    100% { transform: translate(0px, 78px)    rotate(-8deg);  opacity: 0; }
  }

  /* 掉下去的节点不该被 SVG 的 viewBox 裁掉，但也别飞出太远 —— 用透明度收尾就够了 */

  /* 藕丝：细、暗红、微微起伏 */
  .fiber { transition: opacity .9s ease; }
  /*
   * 藕丝的「枯」分三段：
   *   ① 还在颤（前 2.4 秒）—— 断口还有东西拉着
   *   ② 开始干：变细、变暗、颤得更快（2.4 – 3.6 秒）
   *   ③ 回光一下再断（3.6 – 4.2 秒）—— 最后那一下亮，然后消失
   *
   * 所以它比叶子晚死 —— 叶子先落，丝后断。
   */
  body[data-state="error"] .fiber {
    stroke: #ff9a8b;
    animation:
      fiberTremble 3.6s ease-in-out infinite var(--d, 0s),
      fiberWither 3.2s cubic-bezier(.45,.05,.55,.95) 2.2s forwards;
  }
  .fiber-thin { opacity-scale: .6; }
  @keyframes fiberTremble {
    0%, 100% { opacity: .5; }
    50%      { opacity: .82; }
  }

  /*
   * 枯：宽度从 1.8 一路收到 0.15 —— 因为起始够粗，这个收缩过程看得见。
   * 中间那次「回光」是它断之前挣的最后一下。
   * 时间拉到 3.2 秒，慢到能看清。
   */
  @keyframes fiberWither {
    0%   { opacity: .75; stroke-width: 1.35; }
    30%  { opacity: .45; stroke-width: 0.82; }
    52%  { opacity: .30; stroke-width: 0.46; }
    68%  { opacity: .55; stroke-width: 0.72; }   /* 回光 */
    84%  { opacity: .18; stroke-width: 0.3; }
    100% { opacity: 0;   stroke-width: 0.15; }
  }
  @keyframes fault {
    0%, 100% { opacity: .28; }
    50% { opacity: .72; }
  }
  .fault-ring { transition: opacity 1s; }
  body[data-state="error"] .fault-ring {
    animation: fault 2.8s ease-in-out infinite;
    opacity: .3;
  }

  /* ═══ 播放按钮 ═══ */
  .switch {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; z-index: 50;
  }
  .switch button {
    padding: 6px 16px; border-radius: 6px;
    border: 1px solid rgba(255,255,255,.13);
    background: rgba(255,255,255,.03);
    color: rgba(200,222,236,.62);
    font: 10.5px ui-monospace, monospace;
    cursor: pointer; transition: all .18s;
  }
  .switch button:hover { background: rgba(255,255,255,.07); color: rgba(232,246,255,.9); }
  .switch button[data-active="1"] { border-color: rgba(53,240,206,.4); color: var(--accent); background: rgba(53,240,206,.09); }

  .hint {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    font: 8.5px ui-monospace, monospace; letter-spacing: .12em;
    color: rgba(74,96,110,.5); text-align: center; white-space: nowrap;
  }
</style>
</head>
<body data-state="ok">

<div class="switch">
  <button data-play="ok" data-active="1">▶ 正常启动</button>
  <button data-play="warn">▶ 警告：模型服务超时</button>
  <button data-play="error">▶ 失败：数据文件损坏</button>
</div>

<div class="splash">
  <div class="mark" id="mark"></div>
  <div class="wordmark">
    <div class="cn">生 境</div>
    <div class="en">HABITAT</div>
    <div class="tag">SYSTEMIC ECOSYSTEM FOR AGENTS</div>
  </div>
  <div class="panel" id="panel"></div>
</div>

<div class="bar-wrap">
  <div class="bar"><i id="barFill"></i></div>
  <div class="status" id="status">· 初始化</div>
</div>

<div class="hint">点按钮看全过程 —— 进度条推进 → 卡住 → 超时判定 → 变色 → 面板长出 → U 的形态跟着变</div>

<script>
const A = "#35f0ce";

const BR = [
  { d: "M50 54 L30 33", cls: "br-1", flow: "flow" },
  { d: "M50 54 L70 33", cls: "br-2", flow: "flow flow-2" },
  { d: "M50 70 L33 51", cls: "br-3", flow: "flow flow-3" },
  { d: "M50 70 L67 51", cls: "br-4", flow: "flow flow-4" },
];
const TIPS = [
  { x: 30, y: 33, cls: "tip-1", op: ".88" },
  { x: 70, y: 33, cls: "tip-2", op: ".88" },
  { x: 33, y: 51, cls: "tip-3", op: ".62" },
  { x: 67, y: 51, cls: "tip-4", op: ".62" },
];

function buildU(size) {
  /*
   * 每根枝和它的藕丝必须在**同一个 <g> 里**。
   *
   * 之前是分开写的：枝 rotate(19deg) 下垂，但藕丝的坐标是按没转的状态算的，
   * 结果枝转了、丝没转，丝就飘到枝的外面去了 —— 看起来像几根乱线。
   *
   * 绑在一个组里，转一次两个一起转，断口永远对得上。
   */
  const BRANCHES = [
    {
      cls: "br-1",
      flow: "flow",
      d: "M50 54 L30 33",
      tip: { x: 30, y: 33, cls: "tip-1", op: ".88" },
    },
    {
      cls: "br-2",
      flow: "flow flow-2",
      d: "M50 54 L70 33",
      tip: { x: 70, y: 33, cls: "tip-2", op: ".88" },
    },
    {
      cls: "br-3",
      flow: "flow flow-3",
      d: "M50 70 L33 51",
      tip: { x: 33, y: 51, cls: "tip-3", op: ".62" },
    },
    {
      cls: "br-4",
      flow: "flow flow-4",
      d: "M50 70 L67 51",
      tip: { x: 67, y: 51, cls: "tip-4", op: ".62" },
    },
  ];

  let groups = "";
  for (const b of BRANCHES) {
    /* 藕丝 = 枝条路径露出的那一段，见上方注释 */
    const fiberEls = `
      <path class="fiber" style="--d:0s" d="${b.d}" pathLength="100"
        stroke="${A}" stroke-width="1.35" stroke-linecap="butt"
        stroke-dasharray="12 999" stroke-dashoffset="-40" fill="none" opacity="0"/>
      <path class="fiber fiber-thin" style="--d:0.2s" d="${b.d}" pathLength="100"
        stroke="${A}" stroke-width="0.72" stroke-linecap="butt"
        stroke-dasharray="6 999" stroke-dashoffset="-46" fill="none" opacity="0"/>`;
    
    groups += `<g class="branch-group ${b.cls}">
      <path class="branch" d="${b.d}" pathLength="100" stroke="${A}"
        stroke-width="1.9" stroke-linecap="round" opacity=".66" fill="none"/>
      ${fiberEls}
      <path class="${b.flow}" d="${b.d}" stroke="${A}" stroke-width="2.5"
        stroke-linecap="round" stroke-dasharray="6 20" opacity="0" fill="none"/>
    </g>`;
  }

  /* 节点单独一层：失败时要飘落，不能被枝的旋转变换拖着走 */
  let tipLayer = "";
  for (let i = 0; i < BRANCHES.length; i++) {
    const tp = BRANCHES[i].tip;
    /* 每片叶的时长错开，摆动才不同步 */
    const DURS = ["3.2s", "3.9s", "3.5s", "4.1s"];
    tipLayer += `<circle class="tip ${tp.cls}" style="--f:${(i * 0.28).toFixed(2)}s; --dur:${DURS[i]}"
      cx="${tp.x}" cy="${tp.y}" r="2.6" fill="${A}" opacity="${tp.op}"/>`;
  }

  return `<svg viewBox="0 0 100 100" width="${size}" height="${size}">
    <defs>
      <filter id="gU" x="-70%" y="-70%" width="240%" height="240%">
        <feGaussianBlur stdDeviation="2.4" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <g filter="url(#gU)">
      <path class="trunk" d="M50 88 V54" stroke="${A}" stroke-width="2.8"
        stroke-linecap="round" opacity=".88" fill="none"/>
      ${groups}
      ${tipLayer}
      <line class="rootline" x1="40" y1="88" x2="60" y2="88" stroke="${A}"
        stroke-width="2.2" stroke-linecap="round" opacity=".36"/>
      <circle class="fault-ring" cx="50" cy="54" r="13" fill="none" stroke="#ff7a6b"
        stroke-width="1.1" stroke-dasharray="4 7" opacity="0"/>
      <circle class="core" cx="50" cy="54" r="4.2" fill="${A}" opacity=".95"/>
    </g>
  </svg>`;
}

document.getElementById("mark").innerHTML = buildU(240);

const PANELS = {
  warn: {
    title: "部分组件未就绪，但不影响使用",
    body: `<b>模型列表</b>拉取超时（<code>https://llmapi.524228.xyz/v1/models</code> 12 秒无响应）。<br>
           已有的 <b>3 套凭据</b>和 <b>8 个角色</b>都已正常载入 —— 缺的只是「自动补全可用模型」这一步。
           手动填模型名照样能用。`,
    actions: [
      { label: "重新加载", kind: "ghost" },
      { label: "无视警告，进入生境", kind: "primary" },
    ],
  },
  error: {
    title: "数据文件损坏，无法启动",
    body: `<b>出错位置</b>：<code>%APPDATA%\\habitat\\data\\current.json</code><br>
           <b>现象</b>：文件不是合法 JSON（第 1024 字节处截断），角色与凭据无法读取。<br>
           <b>解决</b>：
           <ol>
             <li>打开 <code>%APPDATA%\\habitat\\data\\</code></li>
             <li>把 <code>current.json</code> 改名成 <code>current.json.bad</code>（保留，别删）</li>
             <li>同目录下找最近的 <code>backup-日期.json</code>，复制一份改名成 <code>current.json</code></li>
             <li>回到这里点「重新加载」</li>
           </ol>`,
    actions: [
      { label: "打开数据目录", kind: "ghost" },
      { label: "重新加载", kind: "primary" },
    ],
  },
};

const SCRIPTS = {
  ok: [
    { at: 200,  status: "读取数据文件",      progress: 10 },
    { at: 750,  status: "加载角色档案",      progress: 32 },
    { at: 1250, status: "挂载凭据",         progress: 52 },
    { at: 1750, status: "探测模型服务",      progress: 68 },
    { at: 2900, status: "初始化界面",        progress: 86 },
    { at: 4100, status: "唤醒核心",          progress: 96 },
    { at: 4650, status: "就绪",             progress: 100 },
  ],
  warn: [
    { at: 200,  status: "读取数据文件",      progress: 10 },
    { at: 750,  status: "加载角色档案",      progress: 32 },
    { at: 1250, status: "挂载凭据",         progress: 52 },
    { at: 1750, status: "探测模型服务",      progress: 68 },
    { at: 2100, status: "等待模型列表响应…",  progress: 76 },
    { at: 4200, status: "仍在等待（4s）",     progress: 80 },
    { at: 7000, status: "等待超时（12s）",    progress: 86, state: "warn" },
    { at: 7500, status: "已进入（1 项未就绪）", progress: 86 },
  ],
  error: [
    { at: 200,  status: "读取数据文件",      progress: 10 },
    { at: 900,  status: "解析数据文件…",     progress: 16 },
    { at: 1500, status: "数据文件解析失败",   progress: 18, state: "error" },
    { at: 1900, status: "启动中断",          progress: 18 },
  ],
};

const fill = document.getElementById("barFill");
const statusEl = document.getElementById("status");
const panelEl = document.getElementById("panel");
let timers = [];

function renderPanel(state) {
  const p = PANELS[state];
  if (!p) { panelEl.innerHTML = ""; return; }
  panelEl.innerHTML =
    `<div class="panel-title"><span class="dot"></span>${p.title}</div>` +
    `<div class="panel-body">${p.body}</div>` +
    `<div class="panel-actions">` +
    p.actions.map((a) => `<button class="btn ${a.kind}">${a.label}</button>`).join("") +
    `</div>`;
}

function reset() {
  timers.forEach(clearTimeout);
  timers = [];
  document.body.dataset.state = "ok";
  panelEl.innerHTML = "";
  fill.style.width = "0%";
  statusEl.textContent = "· 初始化";
}

function play(name) {
  reset();
  const script = SCRIPTS[name] || [];
  timers.push(setTimeout(() => {
    for (const step of script) {
      timers.push(setTimeout(() => {
        fill.style.width = step.progress + "%";
        statusEl.textContent = "· " + step.status;
        if (step.state) {
          document.body.dataset.state = step.state;
          renderPanel(step.state);
        }
      }, step.at));
    }
  }, 80));
}

document.querySelectorAll(".switch button").forEach((b) => {
  b.addEventListener("click", () => {
    document.querySelectorAll(".switch button").forEach((x) => (x.dataset.active = "0"));
    b.dataset.active = "1";
    play(b.dataset.play);
  });
});

play("ok");
</script>
</body>
</html>
