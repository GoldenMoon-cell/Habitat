<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>生境 · 记忆神经元（three.js）</title>
<style>
  :root { --cold:#cfefff; --warm:#ffb46b; --mist:#a9c4cf; --biolum:#35f0ce; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;user-select:none;
    background:radial-gradient(ellipse at 50% 46%,#071a24 0%,#030c13 46%,#000305 100%);
    font-family:ui-sans-serif,system-ui,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--mist)}
  canvas.gl{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;z-index:0}
  canvas.gl:active{cursor:grabbing}
  /* 上层 2D：髓鞘光环 + 突触闪现。星在 GL 里画，线和环在 2D 上 —— 好调，也不进 shader */
  canvas.ov{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1;pointer-events:none}
  #hud{position:absolute;left:22px;top:20px;z-index:10;pointer-events:none;font-size:11px;line-height:1.9;color:rgba(169,196,207,.5)}
  #hud h1{margin:0 0 8px;font-size:13px;letter-spacing:.2em;color:rgba(207,239,255,.82);font-weight:500}
  #hud b{color:var(--biolum);font-weight:500}
  #hud .c{color:var(--cold)} #hud .w{color:var(--warm)}
  #legend{position:absolute;left:22px;bottom:20px;z-index:10;display:flex;gap:18px;font-size:10.5px;color:rgba(169,196,207,.42);pointer-events:none}
  #legend span{display:flex;align-items:center;gap:6px}
  #legend i{width:6px;height:6px;border-radius:50%;display:inline-block}
  #tip{position:absolute;right:22px;bottom:20px;z-index:10;font-size:10.5px;color:rgba(169,196,207,.3);pointer-events:none}
  #tag{position:absolute;right:22px;top:20px;z-index:10;font-family:ui-monospace,monospace;font-size:10px;
    padding:4px 9px;border-radius:5px;border:1px solid rgba(53,240,206,.3);color:var(--biolum);opacity:.85}
  #corelabel{position:absolute;transform:translate(-50%,-50%);pointer-events:none;z-index:11;
    font-size:13px;letter-spacing:.1em;color:rgba(226,255,250,.72);text-shadow:0 0 14px rgba(53,240,206,.75)}
  #card{position:absolute;z-index:12;pointer-events:none;opacity:0;transition:opacity .16s ease;
    transform:translate(-50%,-100%) translateY(-16px);
    background:rgba(4,16,24,.94);border:1px solid rgba(53,240,206,.24);border-radius:8px;
    padding:10px 12px;max-width:290px;backdrop-filter:blur(8px);box-shadow:0 12px 40px rgba(0,0,0,.65)}
  #card.on{opacity:1}
  #card .t{font-size:12px;line-height:1.6;color:rgba(226,244,250,.93)}
  #card .m{margin-top:7px;font-size:10px;font-family:ui-monospace,monospace;color:rgba(169,196,207,.5);display:flex;gap:10px;flex-wrap:wrap}
  #card .m b{color:var(--biolum);font-weight:500}
  #fail{position:absolute;inset:0;z-index:99;display:none;align-items:center;justify-content:center;
    font-size:12px;color:rgba(255,150,140,.8);text-align:center;line-height:2;padding:40px}
</style>
</head>
<body>

<canvas class="gl" id="gl"></canvas>
<canvas class="ov" id="ov"></canvas>

<div id="hud">
  <h1>记 忆 神 经 元</h1>
  three.js + Bloom　·　**静息不连线**<br />
  中心 = 她　·　距离 = 权重　· 深度 = 遗忘<br />
  <span class="c">冷白</span> = 皮层　<span class="w">暖橙</span> = 海马体　
  <b>外圈淡环 = 髓鞘</b><br />
  <b>点一颗星</b> —— 它放电，沿突触向相关的星闪一下。
</div>

<div id="tag">神经元 · three.js</div>

<div id="legend">
  <span><i style="background:#cfefff;box-shadow:0 0 8px #cfefff"></i>皮层</span>
  <span><i style="background:#ffb46b;box-shadow:0 0 8px #ffb46b"></i>海马体</span>
  <span><i style="background:#243440"></i>忘了</span>
</div>

<div id="tip">拖动旋转 · 松手回到自动轨道 · 点击放电</div>
<div id="corelabel">鲸</div>
<div id="card"><div class="t"></div><div class="m"></div></div>
<div id="fail"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">
let THREE, EffectComposer, RenderPass, UnrealBloomPass;
try {
  THREE = await import('three');
  ({ EffectComposer } = await import('three/addons/postprocessing/EffectComposer.js'));
  ({ RenderPass }    = await import('three/addons/postprocessing/RenderPass.js'));
  ({ UnrealBloomPass } = await import('three/addons/postprocessing/UnrealBloomPass.js'));
} catch (e) {
  const f = document.getElementById('fail');
  f.style.display = 'flex';
  f.textContent = 'three.js 没能从 CDN 加载：' + e.message;
  throw e;
}

/* ═════════ 数据 ═════════ */
let seed = 20261103;
const rnd = () => (seed = (seed*1664525 + 1013904223) % 4294967296) / 4294967296;

const TAGS = [
  { tag:"长期", n:34, az:0.79, base:.66, spread:.24, cortex:.58 },
  { tag:"偏好", n:27, az:2.36, base:.56, spread:.22, cortex:.45 },
  { tag:"情绪", n:46, az:3.93, base:.20, spread:.14, cortex:.06 },
  { tag:"短期", n:71, az:5.50, base:.15, spread:.12, cortex:.02 },
];
const S = [
  "他说以后一定先跟我说一声","他说他受不了香菜的味道","他答应过不会突然消失",
  "那天海面很安静","他说他有点累","他喝咖啡不加糖","他喜欢在凌晨写东西",
  "他一句话都没说就走了","他说他下午开会","他问了一句几点","他说他不吃辣的",
  "他喜欢下雨天不出门","他说他小时候养过一只猫","他讨厌被人催",
  "他说他今天状态不好","他给我带了一杯热的","他说他明天要早起",
];

const items = [];
for (const c of TAGS) {
  for (let i=0;i<c.n;i++){
    const w = Math.max(.03, Math.min(.96, c.base + (rnd()-.5)*2*c.spread));
    const consolidated = rnd() < c.cortex;
    items.push({
      tag:c.tag,
      text: S[Math.floor(rnd()*S.length)],
      day: Math.floor(rnd()*9),
      w, consolidated,
      forgotten: !consolidated && w < .06 && rnd() < .5,
      accessCount: consolidated ? 3+Math.floor(rnd()*9) : Math.floor(rnd()*3),
      az: c.az + (rnd()-.5)*.70,
      rad: 0, z: 0,
      phase: rnd()*Math.PI*2, speed:.5+rnd()*.9,
    });
  }
}

/* 按排名铺开：最亮贴中心，最暗在最外 */
{
  const order = items.slice().sort((a,b)=>b.w-a.w);
  const n = order.length;
  order.forEach((m,i)=>{
    const f = n>1 ? i/(n-1) : 0;
    m.rad = 0.11 + f*0.95 + (rnd()-.5)*0.10;
    m.z   = 0.25 - f*1.75 + (rnd()-.5)*0.35;
  });
}

const N = items.length;
const SCALE = 9.5;

/* ═════════ 突触关系 ═════════
 * 只用两条免费且真实的信号：
 *   同一天 + 同 tag  —— 同一个场景里发生的事
 *   同实词           —— 双字词命中 ≥ 2（剔停用字）
 * **不用「只有 tag 相同」** —— 那是分类，不是关系。
 */
const STOP = /[我你他她它的了是就不在有也都和与这那什么怎么吗呢吧啊哦嗯没很太要过会一两]/;
function grams(s){
  const clean = s.replace(/[，。！？、…—\s"'「」（）【】]/g,"");
  const out = new Set();
  for (let i=0;i<clean.length-1;i++){
    const g = clean.slice(i,i+2);
    if (!STOP.test(g[0]) && !STOP.test(g[1])) out.add(g);
  }
  return out;
}
const GRAMS = items.map(m => grams(m.text));
function resonates(i,j){
  const A = GRAMS[i], B = GRAMS[j];
  if (!A.size || !B.size) return false;
  let hit = 0;
  for (const g of A) if (B.has(g) && ++hit >= 2) return true;
  return false;
}

const related = items.map(()=>[]);
for (let i=0;i<N;i++){
  for (let j=i+1;j<N;j++){
    const sameMoment = items[i].day === items[j].day && items[i].tag === items[j].tag;
    if (sameMoment || resonates(i,j)) { related[i].push(j); related[j].push(i); }
  }
}
related.forEach((r,i)=>{ if (r.length > 5) related[i] = r.slice(0,5); });

/* ═════════ three.js ═════════ */
const COLD = new THREE.Color('#cfefff');
const WARM = new THREE.Color('#ffb46b');

const pos    = new Float32Array(N*3);
const color  = new Float32Array(N*3);
const sizeA  = new Float32Array(N);
const alpha  = new Float32Array(N);
const baseAlpha = new Float32Array(N);   /* 只读基准 —— 绝不能和 attribute 共用，否则每帧自我复利 */
const phaseA = new Float32Array(N);
const speedA = new Float32Array(N);
const baseAz = new Float32Array(N);
const baseRad= new Float32Array(N);
const baseZ  = new Float32Array(N);

items.forEach((m,i)=>{
  baseAz[i]=m.az; baseRad[i]=m.rad*SCALE; baseZ[i]=m.z*SCALE;
  phaseA[i]=m.phase; speedA[i]=m.speed;
  const c = m.consolidated ? COLD : WARM;
  color[i*3]=c.r; color[i*3+1]=c.g; color[i*3+2]=c.b;
  sizeA[i] = ((m.consolidated?2.4:1.6) + Math.min(m.accessCount,12)*0.22) * 2.7;
  baseAlpha[i] = m.forgotten ? 0.06 : (0.22 + m.w*0.78);
  alpha[i] = baseAlpha[i];
});

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
geo.setAttribute('aColor',   new THREE.BufferAttribute(color,3));
geo.setAttribute('aSize',    new THREE.BufferAttribute(sizeA,1));
geo.setAttribute('aAlpha',   new THREE.BufferAttribute(alpha,1));

const mat = new THREE.ShaderMaterial({
  transparent:true, depthWrite:false, depthTest:false,
  blending: THREE.AdditiveBlending,
  vertexShader:`
    attribute float aSize; attribute float aAlpha; attribute vec3 aColor;
    varying vec3 vColor; varying float vAlpha;
    void main(){
      vColor=aColor; vAlpha=aAlpha;
      vec4 mv = modelViewMatrix * vec4(position,1.0);
      gl_PointSize = aSize * (22.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader:`
    varying vec3 vColor; varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = length(d);
      if (r > 0.5) discard;
      float a = pow(smoothstep(0.5, 0.0, r), 2.4);
      gl_FragColor = vec4(vColor, a * vAlpha * 1.8);
    }`
});

const scene = new THREE.Scene();
scene.add(new THREE.Points(geo, mat));

/* 中心：她 */
const cg = new THREE.BufferGeometry();
cg.setAttribute('position', new THREE.BufferAttribute(new Float32Array([0,0,0]),3));
cg.setAttribute('aColor',   new THREE.BufferAttribute(new Float32Array([0.19,1.0,0.87]),3));
cg.setAttribute('aSize',    new THREE.BufferAttribute(new Float32Array([30]),1));
cg.setAttribute('aAlpha',   new THREE.BufferAttribute(new Float32Array([0.85]),1));
const core = new THREE.Points(cg, mat.clone());
scene.add(core);

const camera = new THREE.PerspectiveCamera(48, 1, 0.1, 400);
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias:true, alpha:true });
renderer.setClearColor(0x000000, 0);
renderer.setPixelRatio(Math.min(devicePixelRatio||1, 2));

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1,1), 0.72, 0.58, 0.14);
composer.addPass(bloom);

/* 上层 2D */
const ov = document.getElementById('ov');
const octx = ov.getContext('2d');
let W=0,H=0,DPR=1;

function resize(){
  W = innerWidth; H = innerHeight;
  DPR = Math.min(devicePixelRatio||1, 2);
  camera.aspect = W/H; camera.updateProjectionMatrix();
  renderer.setSize(W,H,false);
  composer.setSize(W,H);
  bloom.setSize(W*0.8, H*0.8);
  ov.width = W*DPR; ov.height = H*DPR;
  ov.style.width = W+'px'; ov.style.height = H+'px';
  octx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize', resize);
resize();

/* 相机 */
let yaw=0, pitch=-0.62, dragging=false, lx=0, ly=0, idle=9;
const glc = renderer.domElement;
glc.addEventListener('pointerdown',e=>{dragging=true;lx=e.clientX;ly=e.clientY;idle=0});
addEventListener('pointerup',()=>dragging=false);
addEventListener('pointermove',e=>{
  if(!dragging)return;
  yaw += (e.clientX-lx)*0.006;
  pitch = Math.max(-1.25, Math.min(0.35, pitch + (e.clientY-ly)*0.004));
  lx=e.clientX; ly=e.clientY; idle=0;
});

/* 放电 */
let pulse = null;
const PULSE_MS = 900;
const SYNAPSE_MS = 720;

const card = document.getElementById('card');
let screenPts = [];

glc.addEventListener('click', e=>{
  const x = e.clientX, y = e.clientY;
  let best=-1, bd=20;
  for (let k=0;k<screenPts.length;k++){
    const d = Math.hypot(screenPts[k].x-x, screenPts[k].y-y);
    if (d < bd) { bd=d; best=k; }
  }
  if (best < 0) { card.classList.remove('on'); return; }

  pulse = { i: best, t0: performance.now() };

  const m = items[best];
  card.querySelector('.t').textContent = m.text;
  card.querySelector('.m').innerHTML =
    `<span>${m.tag}</span><span>权重 <b>${m.w.toFixed(2)}</b></span>` +
    `<span>${m.forgotten?'已忘':m.consolidated?'皮层 · 髓鞘':'海马体'}</span>` +
    `<span>想起 ${m.accessCount} 次</span>` +
    `<span>${related[best].length} 条突触</span>`;
  card.style.left = x+'px'; card.style.top = y+'px';
  card.classList.add('on');
});

/* 帧 */
const v3 = new THREE.Vector3();
const label = document.getElementById('corelabel');
const t0 = performance.now();

function frame(now){
 try {
  const t = (now-t0)/1000;
  if (!dragging){ idle += 1/60; if (idle>2.2){ yaw += 0.0017; pitch += (-0.62-pitch)*0.012; } }

  const p = geo.attributes.position.array;
  const a = geo.attributes.aAlpha.array;
  for (let i=0;i<N;i++){
    const wob = Math.sin(t*0.20 + phaseA[i]) * 0.035;
    const az  = baseAz[i] + wob;
    p[i*3]   = Math.cos(az) * baseRad[i];
    p[i*3+1] = Math.sin(az) * baseRad[i] * 0.80;
    p[i*3+2] = baseZ[i] + Math.sin(t*0.11 + phaseA[i]) * 0.35;
    const tw = 1 + 0.14*Math.sin(t*speedA[i] + phaseA[i]);
    const boost = (pulse && pulse.i===i && now-pulse.t0 < PULSE_MS)
      ? 1 + 2.4*(1-(now-pulse.t0)/PULSE_MS) : 1;
    a[i] = Math.min(1.6, baseAlpha[i] * tw * boost);
  }
  geo.attributes.position.needsUpdate = true;
  geo.attributes.aAlpha.needsUpdate = true;

  core.scale.setScalar(1 + 0.10*Math.sin(t*0.9));

  const dist = 27;
  camera.position.set(
    Math.sin(yaw)*dist*Math.cos(pitch),
    -dist*Math.sin(pitch),
    Math.cos(yaw)*dist*Math.cos(pitch)
  );
  camera.lookAt(0,0,0);

  screenPts = [];
  for (let i=0;i<N;i++){
    v3.set(p[i*3], p[i*3+1], p[i*3+2]).project(camera);
    screenPts.push({ x:(v3.x*0.5+0.5)*W, y:(-v3.y*0.5+0.5)*H, vis:v3.z<1 });
  }

  composer.render();

  octx.clearRect(0,0,W,H);

  /* ① 髓鞘光环 */
  for (let i=0;i<N;i++){
    const m = items[i], s = screenPts[i];
    if (!s.vis || !m.consolidated || m.w < 0.2) continue;
    const r = 4 + m.w*9;
    octx.beginPath();
    octx.arc(s.x, s.y, r, 0, Math.PI*2);
    octx.strokeStyle = `rgba(200,235,255,${0.045 + m.w*0.10})`;
    octx.lineWidth = 0.9;
    octx.stroke();
  }

  /* ② 突触闪现 */
  if (pulse){
    const dt = now - pulse.t0;
    if (dt < SYNAPSE_MS){
      const k = 1 - dt/SYNAPSE_MS;   /* 1 → 0 */
      const src = screenPts[pulse.i];
      if (src && src.vis){
        const head = Math.min(0.98, Math.max(0.02, dt/160));
        for (const j of related[pulse.i]){
          const dst = screenPts[j];
          if (!dst || !dst.vis) continue;
          const g = octx.createLinearGradient(src.x, src.y, dst.x, dst.y);
          g.addColorStop(0, `rgba(53,240,206,${0.85*k})`);
          g.addColorStop(head, `rgba(210,255,250,${1.0*k})`);
          g.addColorStop(1, `rgba(53,240,206,0)`);
          octx.beginPath();
          octx.moveTo(src.x, src.y);
          octx.lineTo(dst.x, dst.y);
          octx.strokeStyle = g;
          octx.lineWidth = 1.5;
          octx.stroke();

          /* 突触后膜也亮一下 */
          octx.beginPath();
          octx.arc(dst.x, dst.y, 2.2 + 2.2*k, 0, Math.PI*2);
          octx.fillStyle = `rgba(210,255,250,${0.75*k})`;
          octx.fill();
        }
      }
    } else {
      pulse = null;
    }
  }

  /* ③ 扩张环 */
  if (pulse){
    const dt = now - pulse.t0;
    if (dt < PULSE_MS){
      const k = dt/PULSE_MS;
      const s = screenPts[pulse.i];
      if (s && s.vis){
        octx.beginPath();
        octx.arc(s.x, s.y, 6 + k*34, 0, Math.PI*2);
        octx.strokeStyle = `rgba(53,240,206,${(1-k)*0.55})`;
        octx.lineWidth = 1.2;
        octx.stroke();
      }
    }
  }

  v3.set(0,0,0).project(camera);
  label.style.left = ((v3.x*0.5+0.5)*W)+'px';
  label.style.top  = ((-v3.y*0.5+0.5)*H)+'px';
  label.style.opacity = 0.55 + 0.12*Math.sin(t*0.9);

  requestAnimationFrame(frame);
 } catch(err){
   const f = document.getElementById('fail');
   f.style.display='flex';
   f.textContent = 'frame() 抛错: ' + (err && err.message ? err.message : err);
   console.error(err);
 }
}
requestAnimationFrame(frame);
</script>
</body>
</html>
