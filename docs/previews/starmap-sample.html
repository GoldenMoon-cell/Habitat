<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>生境 · 记忆星图（样板）</title>
<style>
  html, body { margin:0; height:100%; background:#04080c; overflow:hidden;
    font-family: ui-sans-serif, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; }
  #root { position:fixed; inset:0; }
  .mono { font-family: var(--mono, ui-monospace, Consolas, monospace); }
  #hud { position:fixed; inset:0; pointer-events:none; opacity:0;
    transition: opacity 1.6s ease; font-size:12px; color:#8fa9bd; }
  #app.app--inside #hud { opacity:1; }
  #hud .t { position:absolute; top:34px; left:40px; }
  #hud .t h1 { margin:0; font-size:26px; letter-spacing:.12em; color:#e6f2fb; font-weight:400; }
  #hud .t p { margin:6px 0 0; font-size:10px; letter-spacing:.26em; color:rgba(143,169,189,.55); }
  #hud .d { position:absolute; top:34px; right:40px; text-align:right; line-height:2; font-size:11px; }
  #hud .l { position:absolute; right:40px; bottom:34px; text-align:right; line-height:2; font-size:11px; }
  #hud .l b { font-weight:400; color:#e6f2fb; margin-left:16px; }
  #gate { position:fixed; inset:0; display:block; text-align:center;
    color:#e6f2fb; cursor:pointer; }
  #gate .in { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); }
  #gate h1 { margin:0; font-size:34px; letter-spacing:.3em; font-weight:300; }
  #gate .sub { margin:10px 0 0; font-size:10px; letter-spacing:.5em; color:rgba(143,169,189,.5); }
  #gate .cta { margin:56px 0 0; font-size:13px; letter-spacing:.4em; color:#35f0ce; }
  #gate .fine { margin:14px 0 0; font-size:10px; letter-spacing:.3em; color:rgba(143,169,189,.4); }
  #rescue { position:fixed; left:50%; bottom:70px; transform:translateX(-50%);
    display:none; text-align:center; }
  #rescue p { margin:0 0 12px; font-size:12px; letter-spacing:.16em; color:#cfe4f2; }
  #rescue button { padding:9px 22px; font:inherit; font-size:11.5px; letter-spacing:.16em;
    background:rgba(53,240,206,.06); color:#35f0ce;
    border:1px solid rgba(53,240,206,.3); border-radius:6px; cursor:pointer; }
  #rescue .bar { margin-top:10px; width:180px; height:1px; background:rgba(255,255,255,.1); margin-left:auto; margin-right:auto; }
  #rescue .fill { height:1px; width:0; background:#35f0ce; transition:width .12s linear; }
  #rescue .note { margin:10px 0 0; font-size:10px; letter-spacing:.2em; color:rgba(143,169,189,.42); }
</style>
</head>
<body>
<div id="app" class="app app--outside" style="position:fixed;inset:0">
  <div id="root"></div>

  <div id="gate">
    <div class="in">
      <h1>沉积</h1>
      <p class="sub">SEDIMENT</p>
      <p class="cta">进入</p>
      <p class="fine mono">点击，或按 ENTER</p>
    </div>
  </div>

  <div id="hud">
    <div class="t">
      <h1>沉积</h1>
      <p>SEDIMENT — 所有落下的，都不会再浮上来</p>
    </div>
    <div class="d mono">
      <div><span id="hx-depth">−0 m</span></div>
      <div><span id="hx-layer">海面</span></div>
      <div style="opacity:.5">Esc 收起</div>
    </div>
    <div class="l mono">
      <div>刻于心里<b id="hx-e">0</b></div>
      <div>随风飘荡<b id="hx-d">0</b></div>
      <div>沉入海床<b id="hx-s">0</b></div>
    </div>
  </div>

  <div id="rescue">
    <p id="rescue-text">正在散开</p>
    <button id="rescue-btn">按住，留住它</button>
    <div class="bar"><div class="fill" id="rescue-fill"></div></div>
    <p class="note">留住的只是还剩下的</p>
  </div>
</div>

.hud > * { opacity: 0; transition: opacity 0.7s ease; }\r
\r
/* \u8FDB\u51FA\u7684\u53EF\u89C1\u6027\uFF1A\u5916\u9762\u53EA\u6709\u95E8\uFF1B\u4E0B\u6F5C\u9014\u4E2D\u53EA\u6709\u6DF1\u5EA6\u8BA1\uFF1B\u5230\u5E95\u540E HUD \u6162\u6162\u6D6E\u73B0 */\r
.starmap-root .app { position: fixed; inset: 0; }\r
.starmap-root .app--outside { cursor: pointer; }\r
.starmap-root .app--inside .hud > * { opacity: 1; transition: opacity 2.4s ease; }\r
.starmap-root .app--entering .hud__depth { opacity: 1; transition: opacity 1.2s ease 0.8s; }\r
.starmap-root .app--leaving .hud__depth { opacity: 0.6; }\r
.starmap-root .app:not(.app--inside) .hud__leave { pointer-events: none; visibility: hidden; }\r
\r
/* \u60AC\u505C\u5728\u661F\u4E0A\u65F6\uFF0C\u65C1\u8FB9\u6D6E\u51FA\u7684\u4E00\u884C\u5C0F\u5B57 */\r
.star-label {\r
  position: fixed;\r
  left: 0;\r
  top: 0;\r
  pointer-events: none;\r
  opacity: 0;\r
  font-size: 9px;\r
  letter-spacing: 0.28em;\r
  white-space: nowrap;\r
  color: rgba(165, 200, 220, 0.7);\r
  will-change: transform, opacity;\r
}\r
.star-label::before {\r
  content: '';\r
  display: inline-block;\r
  width: 18px;\r
  height: 1px;\r
  margin-right: 10px;\r
  vertical-align: middle;\r
  background: rgba(165, 200, 220, 0.4);\r
}\r
.starmap-root .app:not(.app--inside) .star-label { display: none; }\r
\r
.gate {\r
  position: fixed;\r
  left: 50%;\r
  top: calc(50% + 72px);\r
  transform: translateX(-50%);\r
  text-align: center;\r
  pointer-events: none;\r
  opacity: 0;\r
  transition: opacity 0.9s ease, transform 2s ease;\r
  color: rgba(170, 200, 215, 0.62);\r
}\r
.starmap-root .app--outside .gate { opacity: 1; transition: opacity 2.6s ease 0.6s, transform 3s ease; }\r
.starmap-root .app--entering .gate { transform: translate(-50%, 14px); }\r
.gate h1 {\r
  font-weight: 300;\r
  font-size: 13px;\r
  letter-spacing: 1.2em;\r
  margin-right: -1.2em;\r
}\r
.gate__sub {\r
  margin-top: 10px;\r
  font-size: 9px;\r
  letter-spacing: 0.7em;\r
  margin-right: -0.7em;\r
  color: var(--ink-dim);\r
}\r
.gate__cta {\r
  margin-top: 46px;\r
  font-size: 12px;\r
  letter-spacing: 0.9em;\r
  margin-right: -0.9em;\r
  animation: breathe 4.8s ease-in-out infinite;\r
}\r
.gate__fine {\r
  margin-top: 14px;\r
  font-size: 9px;\r
  letter-spacing: 0.25em;\r
  color: var(--ink-dim);\r
}\r
@keyframes breathe {\r
  0%, 100% { opacity: 0.35; }\r
  50% { opacity: 0.9; }\r
}\r
\r
.hud__leave span { margin-left: 0.6em; opacity: 0.6; }\r
.hud__leave.is-busy { opacity: 0.35; pointer-events: none; }\r
\r
.hud__title { position: absolute; top: clamp(20px, 4vw, 48px); left: clamp(20px, 4vw, 48px); }\r
.hud__title h1 {\r
  font-weight: 300;\r
  font-size: 15px;\r
  letter-spacing: 0.9em;\r
  color: rgba(185, 215, 230, 0.7);\r
}\r
.hud__title p {\r
  margin-top: 10px;\r
  font-size: 10px;\r
  letter-spacing: 0.3em;\r
  color: var(--ink-dim);\r
}\r
\r
.hud__depth {\r
  position: absolute;\r
  top: clamp(20px, 4vw, 48px);\r
  right: clamp(20px, 4vw, 48px);\r
  display: flex;\r
  flex-direction: column;\r
  align-items: flex-end;\r
  gap: 10px;\r
  font-size: 10px;\r
  letter-spacing: 0.25em;\r
}\r
.hud__depth button {\r
  pointer-events: auto;\r
  cursor: pointer;\r
  background: none;\r
  border: none;\r
  color: var(--ink-dim);\r
  font-size: 10px;\r
  letter-spacing: 0.25em;\r
  transition: color 0.4s;\r
}\r
.hud__depth button:hover { color: var(--ink); }\r
.depth-layer {\r
  font-size: 9px;\r
  color: rgba(140, 185, 215, 0.55);\r
  letter-spacing: 0.35em;\r
  font-family: var(--serif);\r
}\r
\r
.hud__hint {\r
  position: absolute;\r
  left: clamp(20px, 4vw, 48px);\r
  bottom: clamp(20px, 4vw, 48px);\r
  font-size: 12px;\r
  line-height: 2.1;\r
  letter-spacing: 0.4em;\r
}\r
.hud__hint p { animation: hintIn 1.6s ease both; }\r
.hud__hint p + p { animation-delay: 0.35s; }\r
@keyframes hintIn {\r
  from { opacity: 0; transform: translateY(4px); }\r
  to { opacity: 1; transform: none; }\r
}\r
.hud__fine { font-size: 10px; color: var(--ink-dim); letter-spacing: 0.3em; margin-top: 6px; }\r
\r
.hud__ledger {\r
  position: absolute;\r
  right: clamp(20px, 4vw, 48px);\r
  bottom: clamp(20px, 4vw, 48px);\r
  font-size: 11px;\r
  line-height: 2;\r
  letter-spacing: 0.2em;\r
  text-align: right;\r
}\r
.hud__ledger span {\r
  font-family: var(--serif);\r
  color: var(--ink-dim);\r
  margin-right: 1.4em;\r
  letter-spacing: 0.4em;\r
}\r
\r
/* \u2500\u2500 \u65B0\u7248 HUD \u8D26\u672C \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\r
.hud__ledger {\r
  position: absolute;\r
  right: clamp(20px, 4vw, 48px);\r
  bottom: clamp(20px, 4vw, 48px);\r
  font-size: 10px;\r
  letter-spacing: 0.22em;\r
  text-align: right;\r
}\r
.ledger__row {\r
  display: flex;\r
  align-items: baseline;\r
  justify-content: flex-end;\r
  gap: 1.2em;\r
  line-height: 2;\r
}\r
.ledger__label { color: var(--ink-dim); }\r
.ledger__val { min-width: 1.8em; text-align: right; }\r
.ledger__val.engraved { color: rgba(255, 210, 140, 0.75); }\r
.ledger__val.fading   { color: rgba(140, 175, 210, 0.60); }\r
.ledger__val.sunken   { color: rgba(90, 110, 140, 0.45); }\r
.ledger__last {\r
  margin-top: 10px;\r
  font-size: 9px;\r
  color: var(--ink-dim);\r
  letter-spacing: 0.18em;\r
  opacity: 0.7;\r
  animation: hintIn 1s ease both;\r
}\r
\r
/* \u2500\u2500 \u6D88\u6563\u6551\u56DE\u63D0\u793A \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\r
.rescue {\r
  position: fixed;\r
  left: 50%;\r
  bottom: clamp(60px, 10vh, 100px);\r
  transform: translateX(-50%);\r
  text-align: center;\r
  animation: hintIn 0.6s ease both;\r
  pointer-events: auto;\r
  z-index: 10;\r
}\r
.rescue__text {\r
  font-size: 11px;\r
  letter-spacing: 0.45em;\r
  color: rgba(175, 200, 220, 0.65);\r
  margin-bottom: 10px;\r
}\r
.rescue__btn {\r
  display: block;\r
  margin: 0 auto 10px;\r
  background: none;\r
  border: 1px solid rgba(140, 175, 210, 0.35);\r
  color: rgba(175, 210, 230, 0.7);\r
  font-family: var(--serif);\r
  font-size: 11px;\r
  letter-spacing: 0.5em;\r
  padding: 7px 22px;\r
  cursor: pointer;\r
  transition: border-color 0.3s, color 0.3s;\r
}\r
.rescue__btn:hover { border-color: rgba(175, 210, 230, 0.65); color: rgba(200, 225, 240, 0.9); }\r
.rescue__bar {\r
  width: 120px;\r
  height: 1px;\r
  background: rgba(140, 175, 210, 0.15);\r
  margin: 0 auto;\r
  overflow: hidden;\r
}\r
.rescue__fill {\r
  height: 100%;\r
  background: rgba(150, 195, 220, 0.55);\r
  transition: width 0.5s linear;\r
}\r
\r
\r
\r
/* \u300C\u7559\u4F4F\u7684\u53EA\u662F\u8FD8\u5269\u4E0B\u7684\u300D\u2014\u2014 \u4E00\u53E5\u5FC5\u987B\u8BF4\u6E05\u695A\u7684\u8BDD\uFF0C\u522B\u8BA9\u5B83\u62A2\u6309\u94AE\u7684\u89C6\u7EBF */\r
.starmap-root .rescue__note {\r
  margin-top: 10px;\r
  font-size: 10px;\r
  letter-spacing: 0.22em;\r
  color: var(--ink-dim, rgba(200, 220, 230, 0.42));\r
  text-align: center;\r
}\r
