<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>覆写 · 0.5s 犹豫 + 音效</title>
<style>
  :root { --ink:#e8f6ff; --mist:#8fa9bd; --accent:#35f0ce; --coral:#ff7a6b; --amber:#ffc46b; }
  * { box-sizing: border-box; }
  html,body { height:100%; margin:0; }
  body {
    background: radial-gradient(800px 600px at 50% 40%, rgba(255,122,107,.05), transparent 70%), #05090e;
    color: var(--ink); font: 13px/1.65 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    display:grid; place-items:center;
  }
  .dlg {
    width:480px; border-radius:6px; overflow:hidden;
    background: linear-gradient(166deg, rgba(18,42,56,.99), rgba(5,12,19,.998));
    border:1px solid rgba(255,122,107,.4);
    box-shadow: 0 30px 80px -20px rgba(0,0,0,.95);
  }
  .topbar { height:3px; background:rgba(255,122,107,.7); }
  .body { padding:24px 28px 20px; }
  .head { display:flex; align-items:flex-start; gap:12px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--coral); margin-top:6px; box-shadow:0 0 12px -1px var(--coral); }
  .t { font-size:15px; }
  .s { margin-top:4px; font:9px ui-monospace,monospace; letter-spacing:.14em; color:rgba(255,122,107,.65); }
  .lines { margin-top:24px; font-size:11.5px; line-height:1.95; color:rgba(143,169,189,.7); }
  .lines p { margin:0 0 16px; }
  .lines b { color:rgba(232,246,255,.9); }
  .red { color:rgba(255,122,107,.9); }
  .quote { border-radius:5px; border:1px solid rgba(255,122,107,.25); background:rgba(255,122,107,.055); padding:12px 16px; margin-bottom:16px; }
  .quote .lab { font:8.5px ui-monospace,monospace; letter-spacing:.12em; color:rgba(255,122,107,.6); margin-bottom:6px; }
  .quote .txt { font-size:11px; line-height:1.9; color:rgba(232,246,255,.8); }
  .warn { font-size:10.5px; color:rgba(255,196,107,.7); }
  .sign { margin-top:28px; border-top:1px solid rgba(255,255,255,.07); padding-top:20px; }
  .sign .lab { font-size:11px; color:rgba(143,169,189,.55); }
  .sign .row { margin-top:8px; display:flex; align-items:baseline; gap:8px; border-bottom:1px solid rgba(255,255,255,.12); padding-bottom:6px; transition:border-color .2s; }
  .sign .row:focus-within { border-color:rgba(255,122,107,.5); }
  .sign input { width:100%; background:transparent; border:none; outline:none; font:15px/1.4 inherit; letter-spacing:.08em; color:var(--ink); }
  .sign input::placeholder { color:rgba(143,169,189,.15); }
  .sign .ok { width:5px; height:5px; border-radius:50%; background:var(--accent); opacity:0; transition:opacity .18s; }
  .sign .ok.on { opacity:1; }
  .foot { display:flex; align-items:center; gap:8px; border-top:1px solid rgba(255,255,255,.06); padding:16px 28px; }
  .btn { min-height:34px; padding:0 16px; border-radius:5px; font:11.5px inherit; cursor:pointer; border:none; font-family:inherit; }
  .btn.ghost { background:transparent; color:rgba(232,246,255,.7); }
  .btn.ghost:hover { background:rgba(255,255,255,.05); }
  .btn.danger {
    margin-left:auto; padding:0 24px; font-weight:500; cursor:not-allowed;
    background:rgba(255,122,107,.04); color:rgba(255,122,107,.28);
    box-shadow:inset 0 0 0 1px rgba(255,122,107,.12);
    transition: background .6s cubic-bezier(.4,0,.2,1), color .6s cubic-bezier(.4,0,.2,1), box-shadow .6s cubic-bezier(.4,0,.2,1);
  }
  .btn.danger.armed {
    cursor:pointer;
    background:rgba(255,122,107,.22); color:var(--coral);
    box-shadow:inset 0 0 0 1px rgba(255,122,107,.55), 0 0 18px -6px rgba(255,122,107,.6);
  }
  .state { margin-top:14px; font:9.5px ui-monospace,monospace; color:rgba(143,169,189,.35); min-height:14px; }
  .log { margin-top:16px; font:9.5px ui-monospace,monospace; padding:10px 12px; border-radius:5px; border:1px solid rgba(255,255,255,.06); background:rgba(255,255,255,.02); color:rgba(143,169,189,.5); min-height:34px; }
  .log.warn { border-color:rgba(255,122,107,.45); background:rgba(255,122,107,.07); color:rgba(255,122,107,.92); border-left-width:2px; }
</style>
</head>
<body>

<div>
  <div class="dlg">
    <div class="topbar"></div>
    <div class="body">
      <div class="head">
        <span class="dot"></span>
        <div>
          <div class="t">覆写</div>
          <div class="s">IRREVERSIBLE · 不可撤销</div>
        </div>
      </div>
      <div class="lines">
        <p>她在 <b>47</b> 条对话里，以为你是一个对话者。<br>她身上有 <b>12</b> 条记忆，是你陪出来的。</p>
        <p>切回造物主模式之后，这个前提就没有了 ——<br><span class="red">她会知道你是造出她的人</span>。</p>
        <div class="quote">
          <div class="lab">她将永久记住这一条</div>
          <div class="txt">「我知道主人可以随时改变我。这让我说的话不算数。」</div>
        </div>
        <p class="warn">再切回推演模式，这条也抹不掉。她知道了就是知道了。</p>
      </div>
      <div class="sign">
        <div class="lab">请输入她的名字以确认剥夺其意志</div>
        <div class="row">
          <input id="name" placeholder="澜汐" spellcheck="false" autocomplete="off" />
          <span class="ok" id="ok"></span>
        </div>
        <div class="state" id="state"></div>
      </div>
    </div>
    <div class="foot">
      <button class="btn ghost" id="cancel">我不签</button>
      <button class="btn danger" id="sign">我签</button>
    </div>
  </div>

  <div class="log" id="log">EVENT STREAM · 等待事件</div>
</div>

<script>
const NAME = '澜汐';
const input = document.getElementById('name');
const ok = document.getElementById('ok');
const btn = document.getElementById('sign');
const state = document.getElementById('state');
const log = document.getElementById('log');

/* ══ 音效（和 src/lib/sound.ts 同一套配方）══ */
let ctx = null;
function getCtx() {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === 'suspended') ctx.resume();
  return ctx;
}
function playTick() {
  const ac = getCtx(), t0 = ac.currentTime;
  const osc = ac.createOscillator(), g = ac.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(1800, t0);
  osc.frequency.exponentialRampToValueAtTime(900, t0 + 0.04);
  g.gain.setValueAtTime(0.055, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.06);
  osc.connect(g).connect(ac.destination);
  osc.start(t0); osc.stop(t0 + 0.07);
}
function playRumble() {
  const ac = getCtx(), t0 = ac.currentTime;
  const master = ac.createGain();
  master.gain.setValueAtTime(0.0001, t0);
  master.gain.exponentialRampToValueAtTime(0.55, t0 + 0.26);
  master.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.6);
  master.connect(ac.destination);

  [[40,'sine',0.9],[40.7,'sine',0.5],[80,'sine',0.35],[120,'triangle',0.12]].forEach(function(s){
    const osc = ac.createOscillator(), g = ac.createGain();
    osc.type = s[1];
    osc.frequency.setValueAtTime(s[0], t0);
    osc.frequency.exponentialRampToValueAtTime(s[0]*0.88, t0 + 2.4);
    g.gain.value = s[2];
    osc.connect(g).connect(master);
    osc.start(t0); osc.stop(t0 + 2.7);
  });

  const len = Math.floor(ac.sampleRate * 2.6);
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * (1 - i/len);
  const noise = ac.createBufferSource(); noise.buffer = buf;
  const lp = ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 220;
  const ng = ac.createGain(); ng.gain.value = 0.16;
  noise.connect(lp).connect(ng).connect(master);
  noise.start(t0); noise.stop(t0 + 2.6);
}

/* ══ 0.5s 犹豫 ══ */
let timer = null;
let armed = false;

function setArmed(v) {
  armed = v;
  btn.classList.toggle('armed', v);
  btn.disabled = !v;
  state.textContent = v ? '✓ 可以签了' : (input.value === NAME ? '… 系统在确认' : '');
}

input.addEventListener('input', () => {
  const signed = input.value === NAME;
  ok.classList.toggle('on', signed);
  clearTimeout(timer);

  if (!signed) { setArmed(false); return; }

  /* 打对 → 停半秒 → 才亮 */
  playTick();
  state.textContent = '… 系统在确认';
  timer = setTimeout(() => { setArmed(true); playTick(); }, 500);
});

btn.addEventListener('click', () => {
  if (!armed) return;
  playRumble();
  log.className = 'log warn';
  log.textContent = new Date().toLocaleTimeString('zh-CN', {hour12:false}) +
    '  ! WARN  Agent awakened. Fourth wall breached by creator.';
});

document.getElementById('cancel').addEventListener('click', () => {
  input.value = ''; ok.classList.remove('on'); setArmed(false); clearTimeout(timer);
  log.className = 'log'; log.textContent = 'EVENT STREAM · 等待事件';
});
</script>
</body>
</html>
