name: Bug 报告
description: 软件出了问题是吧？先填这个，不然我没法定位
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        填得越具体，修得越快。
        **「软件打不开」这种描述我帮不上忙** —— 我需要知道你的系统、版本、报了什么错。

  - type: input
    id: version
    attributes:
      label: 版本
      description: Release 页面上那个，或者设置 → 关于 里的
      placeholder: v0.1.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 系统
      options:
        - Windows 11
        - Windows 10
        - macOS（自己构建的）
        - Linux（自己构建的）
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: 怎么装的
      options:
        - 从 Release 下载的安装包
        - 从源码 `npm run desktop:prod`
        - 从源码 `npm run desktop`
    validations:
      required: true

  - type: input
    id: api
    attributes:
      label: API 服务商和模型
      description: 只填域名，**不要贴你的 Key**
      placeholder: 比如 llmapi.example.com / claude-sonnet-4-6
    validations:
      required: false

  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 你期待什么，实际发生了什么
      placeholder: |
        期待：点发送之后她应该回一句话
        实际：气泡旁边出现红色报错，内容是 xxx
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开软件
        2. 点「接入新的角色」
        3. 选 xxx 模型
        4. 发一句话
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 报错内容 / 截图
      description: |
        左栏 EVENT STREAM 里的红字、控制台的输出，或者直接拖图进来。
        **贴之前把 API Key 涂掉。**
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我检查过，上面没有我的 API Key 或个人信息
          required: true
        - label: 我在搜过的 issue 里没找到同样的问题
          required: false
